# ─── Identidade ──────────────────────────────────────────────────────────────
title: "MorrisonKühlsen"
description: "Ex nihilo, ad æternum"
url: "https://morrisonkuhlsen.com"
baseurl: ""
timezone: America/Sao_Paulo
lang: pt

# ─── Build ───────────────────────────────────────────────────────────────────
plugins:
  - jekyll-sitemap
  - jekyll-feed

sass:
  style: compressed
  sourcemap: never

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor

# Deixe vazio para desligar. Só carrega em produção.
google_analytics: G-HBZB4KRNVM

# ─── Comentários (giscus / GitHub Discussions) ───────────────────────────────
giscus:
  repo: "morrisonkuhlsen/morrisonkuhlsen"
  repo_id: "R_kgDOOr6GPQ"
  category: "Announcements"
  category_id: "DIC_kwDOOr6GPc4C8poX"
  mapping: "title"
  reactions_enabled: "0"
  input_position: "top"
  theme: "light"
  lang: "pt"

# ─── Conteúdo ────────────────────────────────────────────────────────────────
permalink: /:title/
excerpt_separator: "<!--more-->"

defaults:
  - scope: { path: "", type: "posts" }
    values:
      layout: post
      lang: pt
  - scope: { path: "", type: "pages" }
    values:
      layout: page
      lang: pt
