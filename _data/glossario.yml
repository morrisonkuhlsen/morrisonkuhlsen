# Glossário A–Z de estatística e probabilidade.
#
# Um item por verbete. `slug` é a âncora na página e entra no índice de busca,
# então mudá-lo quebra links já publicados — acrescente um verbete novo em vez
# de renomear. `ordem` é a chave de ordenação sem acento: o `sort` do Liquid
# compara por código de caractere e jogaria "Álgebra" para depois de "Z".
# `veja` são os links internos que aprofundam o termo.
#
# Nos artigos, a primeira ocorrência de cada termo vira um link com a definição
# ao passar o mouse (assets/js/glossary-tips.js). Valem o próprio termo, a sigla
# entre parênteses e as grafias de `tambem`. `auto: false` tira do automático
# os termos comuns demais na língua corrente ("moda", "evento", "amostra").
#
# Um bloco por idioma (pt e en). Os slugs do inglês são próprios (âncoras de
# /en/glossary), e os links de `veja` apontam para a versão em inglês quando
# ela existe; senão, para a portuguesa, com "(in Portuguese)" no texto.

pt:
  - termo: "Alocação de Neyman"
    slug: alocacao-de-neyman
    ordem: "alocacao de neyman"
    def: "Reparte o tamanho da amostra entre os estratos conforme o tamanho e a variabilidade de cada um: estrato mais heterogêneo recebe mais unidades. Minimiza a variância da estimativa para um custo fixo."
    veja:
      - { t: "Fórmula interativa", u: "/formulas/neyman-allocation.html" }
      - { t: "Amostragem", u: "/pt/inferencia-estatistica/amostragem" }

  - termo: "Amostra"
    slug: amostra
    ordem: "amostra"
    auto: false
    def: "Subconjunto da população efetivamente observado. Toda a inferência estatística consiste em dizer algo sobre a população a partir dela — o que só é honesto quando a amostra foi obtida por um processo aleatório conhecido."
    veja:
      - { t: "Amostragem", u: "/pt/inferencia-estatistica/amostragem" }

  - termo: "Amostragem estratificada"
    slug: amostragem-estratificada
    ordem: "amostragem estratificada"
    def: "Divide a população em estratos homogêneos e sorteia dentro de cada um. Dá estimativas mais precisas que a amostragem simples quando os estratos diferem entre si."
    veja:
      - { t: "Amostragem", u: "/pt/inferencia-estatistica/amostragem" }
      - { t: "Alocação de Neyman", u: "/formulas/neyman-allocation.html" }

  - termo: "Amplitude"
    slug: amplitude
    ordem: "amplitude"
    def: "Diferença entre o maior e o menor valor do conjunto. É a medida de dispersão mais simples e a mais frágil: dois outliers bastam para descrevê-la inteira."
    veja:
      - { t: "Medidas de dispersão", u: "/pt/estatistica-descritiva/dispersao" }

  - termo: "Análise de variância (ANOVA)"
    slug: analise-de-variancia-anova
    ordem: "analise de variancia (anova)"
    def: "Testa se as médias de três ou mais grupos diferem, comparando a variação entre grupos com a variação dentro deles. Rejeitar a hipótese nula diz que alguma média difere, não qual."
    veja:
      - { t: "Análise de Variância", u: "/pt/inferencia-estatistica/analise-variancia" }

  - termo: "Análise exploratória de dados"
    slug: analise-exploratoria-de-dados
    ordem: "analise exploratoria de dados"
    def: "Etapa em que se olha para os dados antes de modelá-los — distribuições, faltantes, outliers, relações — para descobrir o que eles têm a dizer e que suposições são defensáveis."
    veja:
      - { t: "Análise Exploratória de Dados", u: "/pt/estatistica-descritiva/analise-exploratoria" }
      - { t: "Quarteto de Anscombe", u: "/quarteto-de-anscombe-por-que-graficos-sao-indispensaveis-na-estatistica/" }

  - termo: "Assimetria"
    slug: assimetria
    ordem: "assimetria"
    def: "Mede o quanto uma distribuição pende para um dos lados. Com assimetria à direita (cauda longa nos valores altos), a média costuma ficar acima da mediana, e por isso a renda costuma ser resumida pela mediana. A regra tem exceções."
    veja:
      - { t: "Medidas de tendência central", u: "/pt/estatistica-descritiva/tendencia-central" }

  - termo: "Boxplot"
    slug: boxplot
    ordem: "boxplot"
    def: "Gráfico que resume a distribuição numa caixa, do primeiro ao terceiro quartil, com a mediana marcada dentro. Os bigodes vão até os valores mais extremos a no máximo 1,5 × IQR da caixa, e os pontos além disso aparecem à parte. Mostra dispersão e assimetria de uma vez."
    veja:
      - { t: "Boxplot: anatomia", u: "/boxplot-o-que-e-cada-elemento-como-se-calcula-e-como-interpretar/" }

  - termo: "Coeficiente binomial"
    slug: coeficiente-binomial
    ordem: "coeficiente binomial"
    def: "O número de maneiras de escolher k elementos entre n, sem importar a ordem. É também cada entrada do triângulo de Pascal."
    veja:
      - { t: "Fórmula interativa", u: "/formulas/coeficiente-binomial.html" }
      - { t: "Triângulo de Pascal", u: "/triangulo-de-pascal/" }

  - termo: "Coeficiente de variação"
    slug: coeficiente-de-variacao
    ordem: "coeficiente de variacao"
    def: "Desvio padrão dividido pela média, em geral em porcentagem. Permite comparar a dispersão de conjuntos em unidades ou escalas diferentes, mas só faz sentido para variáveis positivas (média maior que zero)."
    veja:
      - { t: "Medidas de dispersão", u: "/pt/estatistica-descritiva/dispersao" }

  - termo: "Combinação"
    slug: combinacao
    ordem: "combinacao"
    auto: false
    def: "Agrupamento em que a ordem não importa. Escolher 6 dezenas entre 60 é uma combinação — por isso a ordem do sorteio não muda a probabilidade do bilhete."
    veja:
      - { t: "Coeficiente binomial", u: "/formulas/coeficiente-binomial.html" }
      - { t: "Mega-Sena", u: "/mega-sena-frequencias/" }

  - termo: "Correção de população finita"
    slug: correcao-de-populacao-finita
    ordem: "correcao de populacao finita"
    tambem: ["correção para população finita"]
    def: "Fator que reduz o erro padrão quando a amostra representa uma parcela grande da população. Sem ele, a incerteza de um censo quase completo sairia exagerada."
    veja:
      - { t: "Fórmula interativa", u: "/formulas/correcao-populacao-finita.html" }

  - termo: "Correlação"
    slug: correlacao
    ordem: "correlacao"
    def: "Mede a força e a direção da associação linear entre duas variáveis, entre −1 e 1. Correlação alta não estabelece causa, e correlação zero não exclui relação não linear."
    veja:
      - { t: "Coeficiente de Pearson", u: "/formulas/coeficiente-pearson.html" }
      - { t: "Quarteto de Anscombe", u: "/quarteto-de-anscombe-por-que-graficos-sao-indispensaveis-na-estatistica/" }

  - termo: "Covariância"
    slug: covariancia
    ordem: "covariancia"
    def: "Mede se duas variáveis se afastam juntas de suas médias. O sinal indica a direção, mas a magnitude depende das unidades — padronizá-la dá a correlação."
    veja:
      - { t: "Fórmula interativa", u: "/formulas/covariancia.html" }

  - termo: "Curtose"
    slug: curtose
    ordem: "curtose"
    def: "Descreve o peso das caudas de uma distribuição em comparação com a normal. Cauda pesada significa que valores extremos são menos raros do que a normal previria."
    veja:
      - { t: "Distribuição normal", u: "/distribuicao-normal/" }

  - termo: "Desigualdade de Chebyshev"
    slug: desigualdade-de-chebyshev
    ordem: "desigualdade de chebyshev"
    tambem: ["teorema de Chebyshev"]
    def: "Garante que, para k > 1, pelo menos 1 − 1/k² das observações ficam a menos de k desvios padrão da média, seja qual for a distribuição. É um limite frouxo, mas exige só que a variância seja finita."
    veja:
      - { t: "Fórmula interativa", u: "/formulas/teorema-chebyshev.html" }

  - termo: "Desvio padrão"
    slug: desvio-padrao
    ordem: "desvio padrao"
    def: "Raiz quadrada da variância: a dispersão dos dados na mesma unidade da variável. Indica o afastamento típico das observações em relação à média, mas não é a média desses afastamentos (essa é o desvio médio absoluto)."
    veja:
      - { t: "Desvio padrão explicado", u: "/desvio-padrao/" }
      - { t: "Medidas de dispersão", u: "/pt/estatistica-descritiva/dispersao" }

  - termo: "Distribuição binomial"
    slug: distribuicao-binomial
    ordem: "distribuicao binomial"
    def: "Descreve o número de sucessos em n tentativas independentes com a mesma probabilidade p. É a soma de n ensaios de Bernoulli."
    veja:
      - { t: "Fórmula interativa", u: "/formulas/distribuicao-binomial.html" }
      - { t: "Cara ou coroa", u: "/cara-ou-coroa/" }

  - termo: "Distribuição de Bernoulli"
    slug: distribuicao-de-bernoulli
    ordem: "distribuicao de bernoulli"
    def: "A distribuição de um único ensaio com dois resultados possíveis, sucesso com probabilidade p e fracasso com 1 − p. É o tijolo da binomial."
    veja:
      - { t: "Fórmula interativa", u: "/formulas/distribuicao-bernoulli.html" }

  - termo: "Distribuição de Poisson"
    slug: distribuicao-de-poisson
    ordem: "distribuicao de poisson"
    def: "Modela a contagem de eventos raros num intervalo fixo de tempo ou espaço, quando ocorrem de forma independente e a uma taxa média constante."
    veja:
      - { t: "Fórmula interativa", u: "/formulas/distribuicao-poisson.html" }

  - termo: "Distribuição normal"
    slug: distribuicao-normal
    ordem: "distribuicao normal"
    def: "A distribuição em forma de sino, simétrica em torno da média e descrita apenas por média e desvio padrão. Aparece com frequência porque somas de muitos efeitos independentes tendem a ela."
    veja:
      - { t: "Distribuição Normal", u: "/distribuicao-normal/" }
      - { t: "Tabela Z", u: "/ztable.html" }

  - termo: "Erro padrão"
    slug: erro-padrao
    ordem: "erro padrao"
    def: "Desvio padrão da distribuição de uma estatística ao longo de amostras repetidas. Mede a incerteza da estimativa, não a variabilidade dos dados — confundir os dois é um erro comum."
    veja:
      - { t: "Desvio padrão x erro padrão", u: "/desvio-padrao-x-erro-padrao-qual-a-diferenca/" }

  - termo: "Erro tipo I"
    slug: erro-tipo-i
    ordem: "erro tipo i"
    def: "Rejeitar a hipótese nula quando ela é verdadeira: um falso positivo. Sua probabilidade é controlada pelo nível de significância α, fixado antes do teste."
    veja:
      - { t: "Testes de hipótese", u: "/pt/inferencia-estatistica/testes-hipotese" }

  - termo: "Erro tipo II"
    slug: erro-tipo-ii
    ordem: "erro tipo ii"
    def: "Não rejeitar a hipótese nula quando ela é falsa: um falso negativo. Sua probabilidade é β, e 1 − β é o poder do teste."
    veja:
      - { t: "Testes de hipótese", u: "/pt/inferencia-estatistica/testes-hipotese" }

  - termo: "Espaço amostral"
    slug: espaco-amostral
    ordem: "espaco amostral"
    def: "O conjunto de todos os resultados possíveis de um experimento aleatório. Definir bem o espaço amostral resolve boa parte dos problemas de probabilidade."
    veja:
      - { t: "Eventos e espaço amostral", u: "/pt/probabilidade/eventos-espaco-amostral" }

  - termo: "Esperança"
    slug: esperanca
    ordem: "esperanca"
    auto: false
    def: "O valor médio de uma variável aleatória a longo prazo, ponderando cada resultado pela sua probabilidade. Também chamada de valor esperado ou média populacional."
    veja:
      - { t: "Variáveis aleatórias", u: "/pt/probabilidade/variaveis-aleatorias" }

  - termo: "Estimador"
    slug: estimador
    ordem: "estimador"
    def: "Regra de cálculo aplicada à amostra para estimar um parâmetro da população. O valor que ela produz numa amostra concreta é a estimativa."
    veja:
      - { t: "Estimadores", u: "/pt/inferencia-estatistica/estimadores" }

  - termo: "Evento"
    slug: evento
    ordem: "evento"
    auto: false
    def: "Qualquer subconjunto do espaço amostral — o conjunto de resultados sob o qual dizemos que algo aconteceu."
    veja:
      - { t: "Eventos e espaço amostral", u: "/pt/probabilidade/eventos-espaco-amostral" }

  - termo: "Fórmula de Cochran"
    slug: formula-de-cochran
    ordem: "formula de cochran"
    def: "Calcula quantos indivíduos a amostra precisa ter para atingir certa margem de erro e certo nível de confiança ao estimar uma proporção."
    veja:
      - { t: "Fórmula interativa", u: "/formulas/cochran-formula.html" }

  - termo: "Frequência relativa"
    slug: frequencia-relativa
    ordem: "frequencia relativa"
    def: "Proporção das observações que caem em cada categoria ou faixa. É a base do histograma e a ponte empírica para a noção de probabilidade."
    veja:
      - { t: "Gráficos estatísticos", u: "/pt/estatistica-descritiva/graficos" }

  - termo: "Função densidade de probabilidade"
    slug: funcao-densidade-de-probabilidade
    ordem: "funcao densidade de probabilidade"
    def: "Para uma variável contínua, a curva cuja área sob um intervalo dá a probabilidade de a variável cair nele. O valor da função num ponto não é uma probabilidade."
    veja:
      - { t: "Variáveis aleatórias", u: "/pt/probabilidade/variaveis-aleatorias" }

  - termo: "Graus de liberdade"
    slug: graus-de-liberdade
    ordem: "graus de liberdade"
    def: "Quantos valores de um cálculo ainda podem variar livremente depois de impostas as restrições. Na variância amostral são n − 1, porque a média já consumiu uma informação."
    veja:
      - { t: "Distribuição t de Student", u: "/formulas/t-student.html" }

  - termo: "Heterocedasticidade"
    slug: heterocedasticidade
    ordem: "heterocedasticidade"
    def: "Quando a variância dos resíduos muda ao longo dos valores previstos. Não enviesa os coeficientes da regressão, mas estraga os erros padrão — e com eles os testes e intervalos."
    veja:
      - { t: "Regressão linear", u: "/pt/analise-de-dados/regressao-linear" }

  - termo: "Hipótese alternativa"
    slug: hipotese-alternativa
    ordem: "hipotese alternativa"
    def: "A afirmação que se aceita caso a hipótese nula seja rejeitada. É ela que carrega a alegação que o estudo quer sustentar."
    veja:
      - { t: "Testes de hipótese", u: "/pt/inferencia-estatistica/testes-hipotese" }

  - termo: "Hipótese nula"
    slug: hipotese-nula
    ordem: "hipotese nula"
    tambem: ["H₀"]
    def: "A hipótese de que não há efeito ou diferença, tomada como verdadeira enquanto os dados não a contrariarem. Um teste nunca a prova: ou a rejeita, ou deixa de rejeitá-la."
    veja:
      - { t: "Testes de hipótese", u: "/pt/inferencia-estatistica/testes-hipotese" }

  - termo: "Histograma"
    slug: histograma
    ordem: "histograma"
    def: "Gráfico de barras contíguas que mostra como as observações se distribuem por faixas de valor. A largura das faixas muda a leitura, então vale testar mais de uma."
    veja:
      - { t: "Gráficos estatísticos", u: "/pt/estatistica-descritiva/graficos" }

  - termo: "Independência"
    slug: independencia
    ordem: "independencia"
    auto: false
    def: "Dois eventos são independentes quando a ocorrência de um não altera a probabilidade do outro — isto é, quando P(A ∩ B) = P(A) · P(B)."
    veja:
      - { t: "Eventos independentes e a regra do produto", u: "/pt/probabilidade/eventos-independentes" }
      - { t: "Probabilidade condicional", u: "/pt/probabilidade/probabilidade-condicional" }

  - termo: "Inferência bayesiana"
    slug: inferencia-bayesiana
    ordem: "inferencia bayesiana"
    def: "Abordagem que trata o parâmetro como incerto e o descreve por uma distribuição, atualizada pelos dados via teorema de Bayes: a priori vira posteriori."
    veja:
      - { t: "Frequentista vs bayesiano", u: "/frequentista-vs-bayesiano-duas-formas-de-pensar-a-incerteza/" }
      - { t: "Teorema de Bayes", u: "/formulas/teorema-bayes.html" }

  - termo: "Intervalo de confiança"
    slug: intervalo-de-confianca
    ordem: "intervalo de confianca"
    tambem: ["intervalos de confiança"]
    def: "Faixa de valores compatíveis com os dados para um parâmetro. A confiança de 95% é uma propriedade do método ao longo de amostras repetidas, não a probabilidade de o parâmetro estar naquele intervalo."
    veja:
      - { t: "Intervalos de confiança", u: "/pt/inferencia-estatistica/intervalos-confianca" }
      - { t: "Fórmula interativa", u: "/formulas/intervalo-confianca.html" }

  - termo: "Intervalo interquartil (IQR)"
    slug: intervalo-interquartil-iqr
    ordem: "intervalo interquartil (iqr)"
    def: "Distância entre o primeiro e o terceiro quartil, ou seja, a amplitude dos 50% centrais. Por ignorar as caudas, resiste a outliers."
    veja:
      - { t: "Boxplot: anatomia", u: "/boxplot-o-que-e-cada-elemento-como-se-calcula-e-como-interpretar/" }

  - termo: "Kaplan-Meier"
    slug: kaplan-meier
    ordem: "kaplan-meier"
    def: "Estimador não paramétrico da curva de sobrevivência que aproveita também as observações censuradas — aquelas cujo desfecho ainda não ocorreu quando o estudo terminou."
    veja:
      - { t: "Demografia das orcas", u: "/orcas-residentes-do-sul-demografia-julia-kaplan-meier/" }

  - termo: "Lei dos grandes números"
    slug: lei-dos-grandes-numeros
    ordem: "lei dos grandes numeros"
    def: "Com muitas repetições, a média observada se aproxima da esperança. É o que faz a frequência longa convergir, e o que não garante nada sobre a próxima jogada."
    veja:
      - { t: "Cara ou coroa", u: "/cara-ou-coroa/" }

  - termo: "Média aritmética"
    slug: media-aritmetica
    ordem: "media aritmetica"
    def: "Soma dos valores dividida pela quantidade deles. Resume bem distribuições simétricas e engana em distribuições assimétricas ou com outliers."
    veja:
      - { t: "Entendendo a média", u: "/media/" }
      - { t: "Medidas de tendência central", u: "/pt/estatistica-descritiva/tendencia-central" }

  - termo: "Média harmônica"
    slug: media-harmonica
    ordem: "media harmonica"
    def: "Recíproca da média das recíprocas. É a média certa para taxas quando o denominador é fixo: dois trechos de mesma distância a 60 km/h e a 40 km/h dão velocidade média de 48 km/h, não 50."
    veja:
      - { t: "Fórmula interativa", u: "/formulas/media-harmonica.html" }

  - termo: "Mediana"
    slug: mediana
    ordem: "mediana"
    def: "O valor que divide o conjunto ordenado em duas metades. Não se move quando um extremo se afasta, o que a torna o resumo preferível em dados assimétricos."
    veja:
      - { t: "Entendendo a mediana", u: "/mediana/" }

  - termo: "Moda"
    slug: moda
    ordem: "moda"
    auto: false
    def: "O valor mais frequente. É a única medida de tendência central aplicável a variáveis puramente categóricas, e um conjunto pode ter mais de uma."
    veja:
      - { t: "Medidas de tendência central", u: "/pt/estatistica-descritiva/tendencia-central" }

  - termo: "Nível de significância"
    slug: nivel-de-significancia
    ordem: "nivel de significancia"
    def: "O limite α escolhido antes do teste para a probabilidade de erro tipo I. O valor 0,05 é convenção herdada, não uma propriedade da natureza."
    veja:
      - { t: "Testes de hipótese", u: "/pt/inferencia-estatistica/testes-hipotese" }

  - termo: "Outlier"
    slug: outlier
    ordem: "outlier"
    tambem: ["outliers"]
    def: "Observação muito distante das demais. Pode ser erro de registro ou o dado mais informativo do conjunto — descartar sem investigar é que não vale."
    veja:
      - { t: "Boxplot: anatomia", u: "/boxplot-o-que-e-cada-elemento-como-se-calcula-e-como-interpretar/" }

  - termo: "p-valor"
    slug: p-valor
    ordem: "p-valor"
    tambem: ["valor-p", "p-valores", "valores-p"]
    def: "Probabilidade de observar um resultado ao menos tão extremo quanto o obtido, supondo verdadeira a hipótese nula. Não é a probabilidade de a hipótese nula ser verdadeira, nem mede o tamanho do efeito."
    veja:
      - { t: "Testes de hipótese", u: "/pt/inferencia-estatistica/testes-hipotese" }

  - termo: "Parâmetro"
    slug: parametro
    ordem: "parametro"
    auto: false
    def: "Característica numérica da população, como μ ou σ: fixa e em geral desconhecida. O que se calcula na amostra é uma estatística, que a estima."
    veja:
      - { t: "Estimadores", u: "/pt/inferencia-estatistica/estimadores" }

  - termo: "Percentil"
    slug: percentil
    ordem: "percentil"
    def: "Valor abaixo do qual cai determinada porcentagem das observações. O percentil 50 é a mediana; os percentis 25 e 75 são o primeiro e o terceiro quartis."
    veja:
      - { t: "Boxplot: anatomia", u: "/boxplot-o-que-e-cada-elemento-como-se-calcula-e-como-interpretar/" }

  - termo: "Permutação"
    slug: permutacao
    ordem: "permutacao"
    def: "Arranjo de elementos em que a ordem importa. Trocar a ordem gera uma permutação nova — diferentemente da combinação."
    veja:
      - { t: "Triângulo de Pascal", u: "/triangulo-de-pascal/" }

  - termo: "Poder do teste"
    slug: poder-do-teste
    ordem: "poder do teste"
    def: "Probabilidade de detectar um efeito que de fato existe, igual a 1 − β. Estudos pequenos demais falham em achar efeitos reais e, quando acham, superestimam o tamanho deles."
    veja:
      - { t: "Testes de hipótese", u: "/pt/inferencia-estatistica/testes-hipotese" }

  - termo: "População"
    slug: populacao
    ordem: "populacao"
    auto: false
    def: "O conjunto completo de unidades sobre o qual se quer concluir algo. Defini-la com precisão é o que determina a quem as conclusões se aplicam."
    veja:
      - { t: "Amostragem", u: "/pt/inferencia-estatistica/amostragem" }

  - termo: "Probabilidade condicional"
    slug: probabilidade-condicional
    ordem: "probabilidade condicional"
    def: "A probabilidade de um evento sabendo que outro ocorreu, escrita P(A|B). Ignorar o condicionamento é a origem de boa parte dos paradoxos da área."
    veja:
      - { t: "Probabilidade condicional", u: "/pt/probabilidade/probabilidade-condicional" }
      - { t: "Fórmula interativa", u: "/formulas/probabilidade-condicional.html" }

  - termo: "Quartil"
    slug: quartil
    ordem: "quartil"
    def: "Cada um dos três valores que dividem o conjunto ordenado em quatro partes iguais. O segundo quartil é a mediana."
    veja:
      - { t: "Boxplot: anatomia", u: "/boxplot-o-que-e-cada-elemento-como-se-calcula-e-como-interpretar/" }

  - termo: "Qui-quadrado"
    slug: qui-quadrado
    ordem: "qui-quadrado"
    def: "Distribuição e família de testes usados para comparar frequências observadas com as esperadas, em testes de aderência e de independência entre variáveis categóricas."
    veja:
      - { t: "Fórmula interativa", u: "/formulas/qui-quadrado.html" }

  - termo: "Regressão linear"
    slug: regressao-linear
    ordem: "regressao linear"
    def: "Ajusta uma reta (ou, com várias variáveis explicativas, um plano) que descreve como a variável resposta muda com as explicativas, minimizando a soma dos quadrados dos resíduos."
    veja:
      - { t: "Regressão linear", u: "/pt/analise-de-dados/regressao-linear" }
      - { t: "Fórmula interativa", u: "/formulas/regressao-linear.html" }

  - termo: "Resíduo"
    slug: residuo
    ordem: "residuo"
    def: "Diferença entre o valor observado e o previsto pelo modelo. Analisar resíduos é como se verifica se o modelo está adequado, e costuma dizer mais que o R²."
    veja:
      - { t: "Regressão linear", u: "/pt/analise-de-dados/regressao-linear" }

  - termo: "Série temporal"
    slug: serie-temporal
    ordem: "serie temporal"
    def: "Sequência de observações ordenadas no tempo, em que valores próximos costumam ser correlacionados. Essa dependência invalida os métodos que supõem observações independentes."
    veja:
      - { t: "Séries temporais", u: "/pt/analise-de-dados/series-temporais" }

  - termo: "Significância estatística"
    slug: significancia-estatistica
    ordem: "significancia estatistica"
    def: "Resultado cujo p-valor ficou abaixo do nível adotado. Diz que o efeito dificilmente vem só do acaso, não que seja grande nem que importe na prática."
    veja:
      - { t: "Testes de hipótese", u: "/pt/inferencia-estatistica/testes-hipotese" }

  - termo: "Taxa de falsas descobertas (FDR)"
    slug: taxa-de-falsas-descobertas-fdr
    ordem: "taxa de falsas descobertas (fdr)"
    def: "Proporção esperada de falsos positivos entre as hipóteses rejeitadas. O procedimento de Benjamini-Hochberg a controla em testes múltiplos independentes (ou com certas formas de dependência positiva), sendo menos conservador que Bonferroni."
    veja:
      - { t: "Um contraexemplo ao método BH", u: "/bh-fdr-contraexemplo/" }

  - termo: "Teorema do limite central (TLC)"
    slug: teorema-central-do-limite
    ordem: "teorema do limite central (tlc)"
    tambem: ["teorema central do limite"]
    def: "A distribuição da média de muitas variáveis independentes, de mesma distribuição e variância finita, se aproxima da normal, qualquer que seja a distribuição de origem. É o que sustenta boa parte da inferência clássica."
    veja:
      - { t: "Teorema do limite central", u: "/pt/probabilidade/teorema-limite-central" }
      - { t: "Fórmula interativa", u: "/formulas/teorema-central-limite.html" }

  - termo: "Teorema da probabilidade total"
    slug: teorema-da-probabilidade-total
    ordem: "teorema da probabilidade total"
    def: "Decompõe a probabilidade de um evento somando suas probabilidades condicionais em cada parte de uma partição do espaço amostral."
    veja:
      - { t: "Fórmula interativa", u: "/formulas/teorema-probabilidade-total.html" }

  - termo: "Teorema de Bayes"
    slug: teorema-de-bayes
    ordem: "teorema de bayes"
    def: "Inverte o condicionamento: converte P(B|A) em P(A|B), pesando pela probabilidade a priori. Explica por que um teste muito preciso ainda gera muitos falsos positivos quando a condição é rara."
    veja:
      - { t: "Fórmula interativa", u: "/formulas/teorema-bayes.html" }
      - { t: "Frequentista vs bayesiano", u: "/frequentista-vs-bayesiano-duas-formas-de-pensar-a-incerteza/" }

  - termo: "Teste t de Student"
    slug: teste-t-de-student
    ordem: "teste t de student"
    tambem: ["teste t"]
    def: "Compara médias quando o desvio padrão da população é desconhecido e precisa ser estimado pela amostra, usando a distribuição t, de caudas mais pesadas que a normal. Com amostra pequena, supõe dados de distribuição aproximadamente normal."
    veja:
      - { t: "Teste z ou teste t?", u: "/testez-ou-testt/" }
      - { t: "Tabela t", u: "/ttable.html" }

  - termo: "Teste z"
    slug: teste-z
    ordem: "teste z"
    def: "Compara médias ou proporções quando o desvio padrão populacional é conhecido, ou quando a amostra é grande o bastante para que a normal valha."
    veja:
      - { t: "Teste z ou teste t?", u: "/testez-ou-testt/" }
      - { t: "Tabela Z", u: "/ztable.html" }

  - termo: "Variância"
    slug: variancia
    ordem: "variancia"
    def: "Média dos quadrados dos desvios em relação à média; na amostra, a soma dos quadrados é dividida por n − 1, não por n. Por estar em unidade ao quadrado, costuma ser reportada como desvio padrão."
    veja:
      - { t: "Medidas de dispersão", u: "/pt/estatistica-descritiva/dispersao" }

  - termo: "Variável aleatória"
    slug: variavel-aleatoria
    ordem: "variavel aleatoria"
    def: "Função que associa um número a cada resultado do experimento. É discreta quando assume valores contáveis e contínua quando assume qualquer valor de um intervalo."
    veja:
      - { t: "Variáveis aleatórias", u: "/pt/probabilidade/variaveis-aleatorias" }

  - termo: "Viés"
    slug: vies
    ordem: "vies"
    def: "Erro sistemático que desloca as estimativas sempre no mesmo sentido. Não diminui com amostra maior — só com mudança no processo de coleta ou no estimador."
    veja:
      - { t: "Amostragem", u: "/pt/inferencia-estatistica/amostragem" }

  - termo: "Z-score"
    slug: z-score
    ordem: "z-score"
    def: "Quantos desvios padrão um valor está da média, dado por (x − μ)/σ. Padroniza escalas diferentes e permite comparar valores de distribuições distintas."
    veja:
      - { t: "Fórmula interativa", u: "/formulas/z-score.html" }
      - { t: "Tabela Z", u: "/ztable.html" }

  - termo: "Frequência acumulada"
    slug: frequencia-acumulada
    ordem: "frequencia acumulada"
    def: "O número (ou a proporção) de observações até uma categoria ou classe, somando as frequências das anteriores. É a lista ordenada resumida: com ela se acham a mediana e os quartis numa tabela."
    veja:
      - { t: "Entendendo a mediana", u: "/mediana/" }

  - termo: "Ponto de ruptura"
    slug: ponto-de-ruptura
    ordem: "ponto de ruptura"
    tambem: ["breakdown point"]
    def: "A fração de dados contaminados que um estimador suporta antes de poder ser levado arbitrariamente longe. O da média é um único valor; o da mediana, quase metade dos dados."
    veja:
      - { t: "Entendendo a mediana", u: "/mediana/" }

  - termo: "Estatística de ordem"
    slug: estatistica-de-ordem
    ordem: "estatistica de ordem"
    tambem: ["estatísticas de ordem"]
    def: "O valor que ocupa a posição k nos dados em ordem crescente, escrito x₍ₖ₎: x₍₁₎ é o mínimo e x₍ₙ₎ é o máximo. Mediana, quartis e amplitude são calculados a partir delas."
    veja:
      - { t: "Entendendo a mediana", u: "/mediana/" }

  - termo: "Distribuição exponencial"
    slug: distribuicao-exponencial
    ordem: "distribuicao exponencial"
    def: "Modela o tempo até um evento que ocorre a uma taxa constante λ, como o intervalo entre chegadas num processo de Poisson. A média é 1/λ e a mediana, ln 2/λ, fica abaixo dela."
    veja:
      - { t: "Entendendo a mediana", u: "/mediana/" }
      - { t: "Distribuição de Poisson", u: "/formulas/distribuicao-poisson.html" }

  - termo: "Distribuição log-normal"
    slug: distribuicao-log-normal
    ordem: "distribuicao log-normal"
    tambem: ["log-normal"]
    def: "A distribuição de uma variável positiva cujo logaritmo segue a normal. É assimétrica à direita, com a mediana abaixo da média, e costuma servir de modelo para rendas e preços."
    veja:
      - { t: "Entendendo a mediana", u: "/mediana/" }

  - termo: "Distribuição de Cauchy"
    slug: distribuicao-de-cauchy
    ordem: "distribuicao de cauchy"
    def: "Distribuição simétrica com caudas tão pesadas que não tem média nem variância. A média de n observações tem a mesma distribuição de uma só, então juntar dados não a melhora; a mediana, sim."
    veja:
      - { t: "Entendendo a mediana", u: "/mediana/" }

  - termo: "Robustez"
    slug: robustez
    ordem: "robustez"
    tambem: ["estatística robusta", "robusta", "robusto"]
    def: "Um método é robusto quando alguns valores atípicos ou pequenas violações das hipóteses mudam pouco o resultado. A mediana é robusta para estimar o centro dos dados; a média, não."
    veja:
      - { t: "Entendendo a mediana", u: "/mediana/" }

en:
  - termo: "Neyman allocation"
    slug: neyman-allocation
    ordem: "neyman allocation"
    def: "Splits the sample size among the strata according to the size and variability of each one: a more heterogeneous stratum gets more units. It minimizes the variance of the estimate for a fixed cost."
    veja:
      - { t: "Interactive formula", u: "/en/formulas/neyman-allocation.html" }
      - { t: "Sampling", u: "/en/statistical-inference/sampling" }

  - termo: "Sample"
    slug: sample
    ordem: "sample"
    auto: false
    def: "The subset of the population that is actually observed. All of statistical inference consists of saying something about the population from it, which is only honest when the sample was drawn by a known random process."
    veja:
      - { t: "Sampling", u: "/en/statistical-inference/sampling" }

  - termo: "Stratified sampling"
    slug: stratified-sampling
    ordem: "stratified sampling"
    def: "Divides the population into homogeneous strata and draws at random within each one. It gives more precise estimates than simple random sampling when the strata differ from each other."
    veja:
      - { t: "Sampling", u: "/en/statistical-inference/sampling" }
      - { t: "Neyman allocation", u: "/en/formulas/neyman-allocation.html" }

  - termo: "Range"
    slug: range
    ordem: "range"
    auto: false
    def: "The difference between the largest and the smallest value in the data set. It is the simplest measure of spread and the most fragile: two outliers are enough to determine it entirely."
    veja:
      - { t: "Measures of dispersion", u: "/en/descriptive-statistics/dispersion" }

  - termo: "Analysis of variance (ANOVA)"
    slug: analysis-of-variance-anova
    ordem: "analysis of variance (anova)"
    def: "Tests whether the means of three or more groups differ, by comparing the variation between groups with the variation within them. Rejecting the null hypothesis says that some mean differs, not which one."
    veja:
      - { t: "Analysis of Variance", u: "/en/statistical-inference/analysis-of-variance" }

  - termo: "Exploratory data analysis"
    slug: exploratory-data-analysis
    ordem: "exploratory data analysis"
    def: "The stage in which you look at the data before modeling them (distributions, missing values, outliers, relationships) to find out what they have to say and which assumptions are defensible."
    veja:
      - { t: "Exploratory Data Analysis", u: "/en/descriptive-statistics/exploratory-analysis" }
      - { t: "Anscombe's quartet (in Portuguese)", u: "/quarteto-de-anscombe-por-que-graficos-sao-indispensaveis-na-estatistica/" }

  - termo: "Skewness"
    slug: skewness
    ordem: "skewness"
    def: "Measures how much a distribution leans to one side. With right skew (a long tail of high values), the mean usually lies above the median, which is why income is usually summarized by the median. The rule has exceptions."
    veja:
      - { t: "Measures of central tendency", u: "/en/descriptive-statistics/central-tendency" }

  - termo: "Boxplot"
    slug: boxplot
    ordem: "boxplot"
    tambem: ["box plot"]
    def: "A chart that summarizes the distribution with a box from the first to the third quartile, with the median marked inside. The whiskers reach the most extreme values within 1.5 × IQR of the box, and points beyond that are shown separately. It shows spread and skewness at once."
    veja:
      - { t: "Boxplot anatomy (in Portuguese)", u: "/boxplot-o-que-e-cada-elemento-como-se-calcula-e-como-interpretar/" }

  - termo: "Binomial coefficient"
    slug: binomial-coefficient
    ordem: "binomial coefficient"
    def: "The number of ways to choose k elements out of n, regardless of order. It is also each entry of Pascal's triangle."
    veja:
      - { t: "Interactive formula", u: "/en/formulas/binomial-coefficient.html" }
      - { t: "Pascal's triangle (in Portuguese)", u: "/triangulo-de-pascal/" }

  - termo: "Coefficient of variation"
    slug: coefficient-of-variation
    ordem: "coefficient of variation"
    def: "The standard deviation divided by the mean, usually as a percentage. It lets you compare the spread of data sets in different units or scales, but it only makes sense for positive variables (mean greater than zero)."
    veja:
      - { t: "Measures of dispersion", u: "/en/descriptive-statistics/dispersion" }

  - termo: "Combination"
    slug: combination
    ordem: "combination"
    auto: false
    def: "A selection in which order does not matter. Choosing 6 numbers out of 60 is a combination, which is why the order of the draw does not change the probability of a ticket."
    veja:
      - { t: "Binomial coefficient", u: "/en/formulas/binomial-coefficient.html" }
      - { t: "Mega-Sena lottery (in Portuguese)", u: "/mega-sena-frequencias/" }

  - termo: "Finite population correction"
    slug: finite-population-correction
    ordem: "finite population correction"
    tambem: ["finite population correction factor"]
    def: "A factor that reduces the standard error when the sample is a large share of the population. Without it, the uncertainty of an almost complete census would come out exaggerated."
    veja:
      - { t: "Interactive formula", u: "/en/formulas/finite-population-correction.html" }

  - termo: "Correlation"
    slug: correlation
    ordem: "correlation"
    def: "Measures the strength and direction of the linear association between two variables, between −1 and 1. High correlation does not establish causation, and zero correlation does not rule out a nonlinear relationship."
    veja:
      - { t: "Pearson correlation", u: "/en/formulas/pearson-correlation.html" }
      - { t: "Anscombe's quartet (in Portuguese)", u: "/quarteto-de-anscombe-por-que-graficos-sao-indispensaveis-na-estatistica/" }

  - termo: "Covariance"
    slug: covariance
    ordem: "covariance"
    def: "Measures whether two variables move away from their means together. The sign gives the direction, but the magnitude depends on the units; standardizing it gives the correlation."
    veja:
      - { t: "Interactive formula", u: "/en/formulas/covariance.html" }

  - termo: "Kurtosis"
    slug: kurtosis
    ordem: "kurtosis"
    def: "Describes how heavy the tails of a distribution are compared with the normal. Heavy tails mean that extreme values are less rare than the normal would predict."
    veja:
      - { t: "Normal distribution", u: "/normal-distribution/" }

  - termo: "Chebyshev's inequality"
    slug: chebyshevs-inequality
    ordem: "chebyshevs inequality"
    tambem: ["Chebyshev's theorem"]
    def: "Guarantees that, for k > 1, at least 1 − 1/k² of the observations lie less than k standard deviations from the mean, whatever the distribution. It is a loose bound, but it only requires the variance to be finite."
    veja:
      - { t: "Interactive formula", u: "/en/formulas/chebyshev-theorem.html" }

  - termo: "Standard deviation"
    slug: standard-deviation
    ordem: "standard deviation"
    def: "The square root of the variance: the spread of the data in the same unit as the variable. It indicates the typical distance of the observations from the mean, but it is not the average of those distances (that is the mean absolute deviation)."
    veja:
      - { t: "Standard deviation explained", u: "/standard-deviation/" }
      - { t: "Measures of dispersion", u: "/en/descriptive-statistics/dispersion" }

  - termo: "Binomial distribution"
    slug: binomial-distribution
    ordem: "binomial distribution"
    def: "Describes the number of successes in n independent trials with the same probability p. It is the sum of n Bernoulli trials."
    veja:
      - { t: "Interactive formula", u: "/en/formulas/binomial-distribution.html" }
      - { t: "Heads or tails (in Portuguese)", u: "/cara-ou-coroa/" }

  - termo: "Bernoulli distribution"
    slug: bernoulli-distribution
    ordem: "bernoulli distribution"
    def: "The distribution of a single trial with two possible outcomes, success with probability p and failure with probability 1 − p. It is the building block of the binomial."
    veja:
      - { t: "Interactive formula", u: "/en/formulas/bernoulli-distribution.html" }

  - termo: "Poisson distribution"
    slug: poisson-distribution
    ordem: "poisson distribution"
    def: "Models the count of rare events in a fixed interval of time or space, when they occur independently and at a constant average rate."
    veja:
      - { t: "Interactive formula", u: "/en/formulas/poisson-distribution.html" }

  - termo: "Normal distribution"
    slug: normal-distribution
    ordem: "normal distribution"
    def: "The bell-shaped distribution, symmetric around the mean and described only by the mean and the standard deviation. It shows up often because sums of many independent effects tend toward it."
    veja:
      - { t: "Normal Distribution", u: "/normal-distribution/" }
      - { t: "Z table", u: "/ztable.html" }

  - termo: "Standard error"
    slug: standard-error
    ordem: "standard error"
    def: "The standard deviation of the distribution of a statistic over repeated samples. It measures the uncertainty of the estimate, not the variability of the data; mixing the two up is a common mistake."
    veja:
      - { t: "Standard deviation vs. standard error (in Portuguese)", u: "/desvio-padrao-x-erro-padrao-qual-a-diferenca/" }

  - termo: "Type I error"
    slug: type-i-error
    ordem: "type i error"
    def: "Rejecting the null hypothesis when it is true: a false positive. Its probability is controlled by the significance level α, set before the test."
    veja:
      - { t: "Hypothesis testing", u: "/en/statistical-inference/hypothesis-testing" }

  - termo: "Type II error"
    slug: type-ii-error
    ordem: "type ii error"
    def: "Failing to reject the null hypothesis when it is false: a false negative. Its probability is β, and 1 − β is the power of the test."
    veja:
      - { t: "Hypothesis testing", u: "/en/statistical-inference/hypothesis-testing" }

  - termo: "Sample space"
    slug: sample-space
    ordem: "sample space"
    def: "The set of all possible outcomes of a random experiment. Defining the sample space well solves a good part of probability problems."
    veja:
      - { t: "Sample space and events", u: "/en/probability/sample-space-events" }

  - termo: "Expected value"
    slug: expected-value
    ordem: "expected value"
    def: "The long-run average value of a random variable, weighting each outcome by its probability. Also called the expectation or the population mean."
    veja:
      - { t: "Random variables", u: "/en/probability/random-variables" }

  - termo: "Estimator"
    slug: estimator
    ordem: "estimator"
    def: "A calculation rule applied to the sample to estimate a population parameter. The value it produces for a specific sample is the estimate."
    veja:
      - { t: "Estimators", u: "/en/statistical-inference/estimators" }

  - termo: "Event"
    slug: event
    ordem: "event"
    auto: false
    def: "Any subset of the sample space: the set of outcomes under which we say that something happened."
    veja:
      - { t: "Sample space and events", u: "/en/probability/sample-space-events" }

  - termo: "Cochran's formula"
    slug: cochrans-formula
    ordem: "cochrans formula"
    def: "Computes how many individuals the sample needs to reach a given margin of error and confidence level when estimating a proportion."
    veja:
      - { t: "Interactive formula", u: "/en/formulas/cochran-formula.html" }

  - termo: "Relative frequency"
    slug: relative-frequency
    ordem: "relative frequency"
    def: "The proportion of the observations that fall in each category or range. It is the basis of the histogram and the empirical bridge to the notion of probability."
    veja:
      - { t: "Statistical charts", u: "/en/descriptive-statistics/charts" }

  - termo: "Probability density function (PDF)"
    slug: probability-density-function-pdf
    ordem: "probability density function (pdf)"
    def: "For a continuous variable, the curve whose area over an interval gives the probability that the variable falls in it. The value of the function at a point is not a probability."
    veja:
      - { t: "Random variables", u: "/en/probability/random-variables" }

  - termo: "Degrees of freedom"
    slug: degrees-of-freedom
    ordem: "degrees of freedom"
    def: "How many values in a calculation can still vary freely once the constraints are imposed. For the sample variance there are n − 1, because the mean has already used up one piece of information."
    veja:
      - { t: "Student's t distribution", u: "/en/formulas/students-t-test.html" }

  - termo: "Heteroscedasticity"
    slug: heteroscedasticity
    ordem: "heteroscedasticity"
    tambem: ["heteroskedasticity"]
    def: "When the variance of the residuals changes along the predicted values. It does not bias the regression coefficients, but it spoils the standard errors, and with them the tests and intervals."
    veja:
      - { t: "Linear regression", u: "/en/data-analysis/linear-regression" }

  - termo: "Alternative hypothesis"
    slug: alternative-hypothesis
    ordem: "alternative hypothesis"
    def: "The statement favored if the null hypothesis is rejected. It carries the claim that the study wants to support."
    veja:
      - { t: "Hypothesis testing", u: "/en/statistical-inference/hypothesis-testing" }

  - termo: "Null hypothesis"
    slug: null-hypothesis
    ordem: "null hypothesis"
    tambem: ["H₀"]
    def: "The hypothesis of no effect or no difference, taken as true as long as the data do not contradict it. A test never proves it: it either rejects it or fails to reject it."
    veja:
      - { t: "Hypothesis testing", u: "/en/statistical-inference/hypothesis-testing" }

  - termo: "Histogram"
    slug: histogram
    ordem: "histogram"
    def: "A chart of adjacent bars showing how the observations are distributed across ranges of values. The width of the ranges changes the reading, so it is worth trying more than one."
    veja:
      - { t: "Statistical charts", u: "/en/descriptive-statistics/charts" }

  - termo: "Independence"
    slug: independence
    ordem: "independence"
    auto: false
    def: "Two events are independent when the occurrence of one does not change the probability of the other, that is, when P(A ∩ B) = P(A) · P(B)."
    veja:
      - { t: "Independent events and the product rule", u: "/en/probability/independent-events" }
      - { t: "Conditional probability", u: "/en/probability/conditional-probability" }

  - termo: "Bayesian inference"
    slug: bayesian-inference
    ordem: "bayesian inference"
    def: "An approach that treats the parameter as uncertain and describes it with a distribution, updated by the data through Bayes' theorem: the prior becomes the posterior."
    veja:
      - { t: "Frequentist vs. Bayesian (in Portuguese)", u: "/frequentista-vs-bayesiano-duas-formas-de-pensar-a-incerteza/" }
      - { t: "Bayes' theorem", u: "/en/formulas/bayes-theorem.html" }

  - termo: "Confidence interval"
    slug: confidence-interval
    ordem: "confidence interval"
    tambem: ["confidence intervals"]
    def: "A range of values for a parameter that are compatible with the data. The 95% confidence is a property of the method over repeated samples, not the probability that the parameter lies in that interval."
    veja:
      - { t: "Confidence intervals", u: "/en/statistical-inference/confidence-intervals" }
      - { t: "Interactive formula", u: "/en/formulas/confidence-interval.html" }

  - termo: "Interquartile range (IQR)"
    slug: interquartile-range-iqr
    ordem: "interquartile range (iqr)"
    def: "The distance between the first and the third quartile, that is, the range of the middle 50%. Because it ignores the tails, it resists outliers."
    veja:
      - { t: "Boxplot anatomy (in Portuguese)", u: "/boxplot-o-que-e-cada-elemento-como-se-calcula-e-como-interpretar/" }

  - termo: "Kaplan-Meier"
    slug: kaplan-meier
    ordem: "kaplan-meier"
    def: "A nonparametric estimator of the survival curve that also makes use of censored observations: those whose outcome had not yet occurred when the study ended."
    veja:
      - { t: "Orca demography", u: "/southern-resident-killer-whales-demography-julia-kaplan-meier/" }

  - termo: "Law of large numbers"
    slug: law-of-large-numbers
    ordem: "law of large numbers"
    def: "With many repetitions, the observed average approaches the expected value. It is what makes the long-run frequency converge, and it guarantees nothing about the next play."
    veja:
      - { t: "Heads or tails (in Portuguese)", u: "/cara-ou-coroa/" }

  - termo: "Arithmetic mean"
    slug: arithmetic-mean
    ordem: "arithmetic mean"
    def: "The sum of the values divided by how many there are. It summarizes symmetric distributions well and misleads with skewed distributions or outliers."
    veja:
      - { t: "Understanding the mean (in Portuguese)", u: "/media/" }
      - { t: "Measures of central tendency", u: "/en/descriptive-statistics/central-tendency" }

  - termo: "Harmonic mean"
    slug: harmonic-mean
    ordem: "harmonic mean"
    def: "The reciprocal of the mean of the reciprocals. It is the right average for rates when the denominator is fixed: two legs of the same distance at 60 km/h and 40 km/h give an average speed of 48 km/h, not 50."
    veja:
      - { t: "Interactive formula", u: "/en/formulas/harmonic-mean.html" }

  - termo: "Median"
    slug: median
    ordem: "median"
    def: "The value that splits the sorted data into two halves. It does not move when an extreme value moves further out, which makes it the preferable summary for skewed data."
    veja:
      - { t: "Understanding the median (in Portuguese)", u: "/mediana/" }

  - termo: "Mode"
    slug: mode
    ordem: "mode"
    auto: false
    def: "The most frequent value. It is the only measure of central tendency that applies to purely categorical variables, and a data set can have more than one."
    veja:
      - { t: "Measures of central tendency", u: "/en/descriptive-statistics/central-tendency" }

  - termo: "Significance level"
    slug: significance-level
    ordem: "significance level"
    def: "The limit α, chosen before the test, for the probability of a Type I error. The value 0.05 is an inherited convention, not a property of nature."
    veja:
      - { t: "Hypothesis testing", u: "/en/statistical-inference/hypothesis-testing" }

  - termo: "Outlier"
    slug: outlier
    ordem: "outlier"
    tambem: ["outliers"]
    def: "An observation very far from the others. It may be a recording error or the most informative data point in the set; what is not acceptable is discarding it without investigating."
    veja:
      - { t: "Boxplot anatomy (in Portuguese)", u: "/boxplot-o-que-e-cada-elemento-como-se-calcula-e-como-interpretar/" }

  - termo: "p-value"
    slug: p-value
    ordem: "p-value"
    tambem: ["p-values"]
    def: "The probability of observing a result at least as extreme as the one obtained, assuming the null hypothesis is true. It is not the probability that the null hypothesis is true, nor does it measure the size of the effect."
    veja:
      - { t: "Hypothesis testing", u: "/en/statistical-inference/hypothesis-testing" }

  - termo: "Parameter"
    slug: parameter
    ordem: "parameter"
    auto: false
    def: "A numerical characteristic of the population, such as μ or σ: fixed and usually unknown. What is computed from the sample is a statistic, which estimates it."
    veja:
      - { t: "Estimators", u: "/en/statistical-inference/estimators" }

  - termo: "Percentile"
    slug: percentile
    ordem: "percentile"
    def: "The value below which a given percentage of the observations falls. The 50th percentile is the median; the 25th and 75th percentiles are the first and third quartiles."
    veja:
      - { t: "Boxplot anatomy (in Portuguese)", u: "/boxplot-o-que-e-cada-elemento-como-se-calcula-e-como-interpretar/" }

  - termo: "Permutation"
    slug: permutation
    ordem: "permutation"
    def: "An arrangement of elements in which order matters. Changing the order produces a new permutation, unlike a combination."
    veja:
      - { t: "Pascal's triangle (in Portuguese)", u: "/triangulo-de-pascal/" }

  - termo: "Statistical power"
    slug: statistical-power
    ordem: "statistical power"
    tambem: ["power of the test"]
    def: "The probability of detecting an effect that really exists, equal to 1 − β. Studies that are too small fail to find real effects and, when they do find them, overestimate their size."
    veja:
      - { t: "Hypothesis testing", u: "/en/statistical-inference/hypothesis-testing" }

  - termo: "Population"
    slug: population
    ordem: "population"
    auto: false
    def: "The complete set of units about which you want to conclude something. Defining it precisely is what determines to whom the conclusions apply."
    veja:
      - { t: "Sampling", u: "/en/statistical-inference/sampling" }

  - termo: "Conditional probability"
    slug: conditional-probability
    ordem: "conditional probability"
    def: "The probability of an event given that another one has occurred, written P(A|B). Ignoring the conditioning is the source of many of the field's paradoxes."
    veja:
      - { t: "Conditional probability", u: "/en/probability/conditional-probability" }
      - { t: "Interactive formula", u: "/en/formulas/conditional-probability.html" }

  - termo: "Quartile"
    slug: quartile
    ordem: "quartile"
    def: "Each of the three values that split the sorted data into four equal parts. The second quartile is the median."
    veja:
      - { t: "Boxplot anatomy (in Portuguese)", u: "/boxplot-o-que-e-cada-elemento-como-se-calcula-e-como-interpretar/" }

  - termo: "Chi-square"
    slug: chi-square
    ordem: "chi-square"
    tambem: ["chi-squared"]
    def: "A distribution and a family of tests used to compare observed frequencies with expected ones, in goodness-of-fit tests and tests of independence between categorical variables."
    veja:
      - { t: "Interactive formula", u: "/en/formulas/chi-square-test.html" }

  - termo: "Linear regression"
    slug: linear-regression
    ordem: "linear regression"
    def: "Fits a line (or, with several explanatory variables, a plane) that describes how the response variable changes with the explanatory ones, by minimizing the sum of squared residuals."
    veja:
      - { t: "Linear regression", u: "/en/data-analysis/linear-regression" }
      - { t: "Interactive formula", u: "/en/formulas/linear-regression.html" }

  - termo: "Residual"
    slug: residual
    ordem: "residual"
    def: "The difference between the observed value and the value predicted by the model. Analyzing residuals is how you check whether the model is adequate, and it usually tells more than R²."
    veja:
      - { t: "Linear regression", u: "/en/data-analysis/linear-regression" }

  - termo: "Time series"
    slug: time-series
    ordem: "time series"
    def: "A sequence of observations ordered in time, in which nearby values are usually correlated. This dependence invalidates methods that assume independent observations."
    veja:
      - { t: "Time series", u: "/en/data-analysis/time-series" }

  - termo: "Statistical significance"
    slug: statistical-significance
    ordem: "statistical significance"
    def: "A result whose p-value fell below the chosen level. It says that the effect is unlikely to come from chance alone, not that it is large or that it matters in practice."
    veja:
      - { t: "Hypothesis testing", u: "/en/statistical-inference/hypothesis-testing" }

  - termo: "False discovery rate (FDR)"
    slug: false-discovery-rate-fdr
    ordem: "false discovery rate (fdr)"
    def: "The expected proportion of false positives among the rejected hypotheses. The Benjamini-Hochberg procedure controls it in multiple testing when the tests are independent (or have certain forms of positive dependence), and it is less conservative than Bonferroni."
    veja:
      - { t: "A counterexample to the BH method (in Portuguese)", u: "/bh-fdr-contraexemplo/" }

  - termo: "Central Limit Theorem (CLT)"
    slug: central-limit-theorem-clt
    ordem: "central limit theorem (clt)"
    def: "The distribution of the mean of many independent variables, with the same distribution and finite variance, approaches the normal, whatever the original distribution. It underpins much of classical inference."
    veja:
      - { t: "Central Limit Theorem", u: "/en/probability/central-limit-theorem" }
      - { t: "Interactive formula", u: "/en/formulas/central-limit-theorem.html" }

  - termo: "Law of total probability"
    slug: law-of-total-probability
    ordem: "law of total probability"
    def: "Breaks the probability of an event into a sum of its conditional probabilities over each part of a partition of the sample space."
    veja:
      - { t: "Interactive formula", u: "/en/formulas/law-of-total-probability.html" }

  - termo: "Bayes' theorem"
    slug: bayes-theorem
    ordem: "bayes theorem"
    def: "Reverses the conditioning: it turns P(B|A) into P(A|B), weighting by the prior probability. It explains why a very accurate test still produces many false positives when the condition is rare."
    veja:
      - { t: "Interactive formula", u: "/en/formulas/bayes-theorem.html" }
      - { t: "Frequentist vs. Bayesian (in Portuguese)", u: "/frequentista-vs-bayesiano-duas-formas-de-pensar-a-incerteza/" }

  - termo: "Student's t-test"
    slug: students-t-test
    ordem: "students t-test"
    tambem: ["t-test"]
    def: "Compares means when the population standard deviation is unknown and has to be estimated from the sample, using the t distribution, whose tails are heavier than the normal's. With a small sample, it assumes data from an approximately normal distribution."
    veja:
      - { t: "Z-test or t-test? (in Portuguese)", u: "/testez-ou-testt/" }
      - { t: "t table", u: "/ttable.html" }

  - termo: "Z-test"
    slug: z-test
    ordem: "z-test"
    def: "Compares means or proportions when the population standard deviation is known, or when the sample is large enough for the normal approximation to hold."
    veja:
      - { t: "Z-test or t-test? (in Portuguese)", u: "/testez-ou-testt/" }
      - { t: "Z table", u: "/ztable.html" }

  - termo: "Variance"
    slug: variance
    ordem: "variance"
    def: "The mean of the squared deviations from the mean; for a sample, the sum of squares is divided by n − 1, not by n. Because it is in squared units, it is usually reported as the standard deviation."
    veja:
      - { t: "Measures of dispersion", u: "/en/descriptive-statistics/dispersion" }

  - termo: "Random variable"
    slug: random-variable
    ordem: "random variable"
    def: "A function that assigns a number to each outcome of the experiment. It is discrete when it takes countable values and continuous when it can take any value in an interval."
    veja:
      - { t: "Random variables", u: "/en/probability/random-variables" }

  - termo: "Bias"
    slug: bias
    ordem: "bias"
    def: "A systematic error that shifts the estimates always in the same direction. It does not shrink with a larger sample, only with a change in the collection process or in the estimator."
    veja:
      - { t: "Sampling", u: "/en/statistical-inference/sampling" }

  - termo: "Z-score"
    slug: z-score
    ordem: "z-score"
    def: "How many standard deviations a value is from the mean, given by (x − μ)/σ. It standardizes different scales and lets you compare values from different distributions."
    veja:
      - { t: "Interactive formula", u: "/en/formulas/z-score.html" }
      - { t: "Z table", u: "/ztable.html" }

  - termo: "Cumulative frequency"
    slug: cumulative-frequency
    ordem: "cumulative frequency"
    def: "The number (or proportion) of observations up to a category or class, adding the frequencies of the previous ones. It is the sorted list in summary form: with it you find the median and quartiles in a table."
    veja:
      - { t: "Understanding the median", u: "/median/" }

  - termo: "Breakdown point"
    slug: breakdown-point
    ordem: "breakdown point"
    def: "The fraction of contaminated data an estimator withstands before it can be pushed arbitrarily far. For the mean it is a single value; for the median, almost half of the data."
    veja:
      - { t: "Understanding the median", u: "/median/" }

  - termo: "Order statistic"
    slug: order-statistic
    ordem: "order statistic"
    tambem: ["order statistics"]
    def: "The value in position k of the data sorted in increasing order, written x₍ₖ₎: x₍₁₎ is the minimum and x₍ₙ₎ is the maximum. The median, quartiles and range are computed from them."
    veja:
      - { t: "Understanding the median", u: "/median/" }

  - termo: "Exponential distribution"
    slug: exponential-distribution
    ordem: "exponential distribution"
    def: "Models the time until an event that occurs at a constant rate λ, such as the gap between arrivals in a Poisson process. The mean is 1/λ and the median, ln 2/λ, lies below it."
    veja:
      - { t: "Understanding the median", u: "/median/" }
      - { t: "Poisson distribution", u: "/en/formulas/poisson-distribution.html" }

  - termo: "Log-normal distribution"
    slug: log-normal-distribution
    ordem: "log-normal distribution"
    tambem: ["lognormal distribution"]
    def: "The distribution of a positive variable whose logarithm follows the normal. It is right-skewed, with the median below the mean, and is often used as a model for incomes and prices."
    veja:
      - { t: "Understanding the median", u: "/median/" }

  - termo: "Cauchy distribution"
    slug: cauchy-distribution
    ordem: "cauchy distribution"
    def: "A symmetric distribution with tails so heavy that it has no mean and no variance. The mean of n observations has the same distribution as a single one, so more data do not improve it; the median does improve."
    veja:
      - { t: "Understanding the median", u: "/median/" }

  - termo: "Robustness"
    slug: robustness
    ordem: "robustness"
    tambem: ["robust statistics", "robust"]
    def: "A method is robust when a few outliers or small violations of its assumptions change the result little. The median is robust for estimating the center of the data; the mean is not."
    veja:
      - { t: "Understanding the median", u: "/median/" }
