# Catálogo de testes estatísticos (/testes-estatisticos/).
#
# Fonte única: o Jekyll gera daqui o dados.js que a página usa e a lista em
# HTML estático que fica abaixo da tabela (e que os buscadores leem).
#
# Bloco principal: coluna = família, linha = delineamento. As faixas de baixo
# guardam o que não depende de quantos grupos há.
# Cada teste traz `row` + `col` (bloco) ou `strip` + `pos` (faixa).
# `vars` lista variantes como [texto, ref]; um `ref` aponta para outro teste.
# `efeito` é o tamanho de efeito usual: `texto` e, se houver, `tex`.
# `reporte` é um exemplo de como escrever o resultado; `codigo` traz `r` e
# `py` (no Python, `stats` é scipy.stats e `np`, numpy).
# `page` é a fórmula interativa do próprio teste em /formulas/, quando existe;
# `veja` lista fórmulas relacionadas. Os dois usam o nome do arquivo, sem .html.
# `tex` vai entre aspas simples: assim a barra invertida do LaTeX fica literal.

# `dica` é o tooltip do rótulo da coluna, linha ou faixa: explica o termo
# para quem não conhece o jargão.
familias:
  medias:
    nome: 'Médias'
    sub: 'paramétricos'
    cor: 1
    dica: 'Testes paramétricos supõem um modelo para os dados, em geral a distribuição normal, e comparam parâmetros dele, como a média. Quando o pressuposto vale, são os mais poderosos.'
  postos:
    nome: 'Postos'
    sub: 'não paramétricos'
    cor: 2
    dica: 'Testes não paramétricos não supõem uma distribuição para os dados. Trocam cada valor pelo seu posto, a posição na ordem (1º, 2º, 3º…), o que os protege de valores extremos e serve para dados ordinais.'
  prop:
    nome: 'Proporções'
    sub: 'contagens'
    cor: 3
    dica: 'Para respostas categóricas, como sim ou não, acerto ou erro: o dado é quantas vezes cada categoria aparece, e o teste compara proporções.'
  vari:
    nome: 'Variâncias'
    sub: 'dispersão'
    cor: 4
    dica: 'Comparam o quanto os dados se espalham, não o centro. Servem por si mesmos, como no controle de qualidade, e para conferir o pressuposto de variâncias iguais de outros testes.'
  ader:
    nome: 'Aderência e normalidade'
    cor: 5
    dica: 'Aderência: os dados seguem a distribuição esperada? Os testes de normalidade são o caso mais comum e conferem um pressuposto dos testes paramétricos.'
  assoc:
    nome: 'Associação e correlação'
    cor: 6
    dica: 'Em vez de comparar grupos, medem se duas variáveis variam juntas e com que força.'
  modelos:
    nome: 'Modelos e regressão'
    cor: 7
    dica: 'Testes feitos dentro de um modelo ajustado: se um coeficiente importa, se o modelo explica algo e se os resíduos cumprem os pressupostos.'
  series:
    nome: 'Séries temporais'
    cor: 8
    dica: 'Para observações ordenadas no tempo, em que valores vizinhos costumam ser correlacionados: testam estacionariedade e autocorrelação.'
colunas: [medias, postos, prop, vari]
linhas:
  - nome: 'Uma amostra'
    dica: 'Um único grupo comparado com um valor de referência fixado de antemão, como uma meta ou um padrão.'
  - nome: 'Duas amostras independentes'
    dica: 'Dois grupos de indivíduos diferentes, sem relação entre si, como tratamento e controle.'
  - nome: 'Duas amostras pareadas'
    dica: 'Duas medidas ligadas aos pares: o mesmo indivíduo antes e depois, ou pares casados, como gêmeos. O teste usa a diferença dentro de cada par.'
  - nome: 'Três ou mais grupos independentes'
    dica: 'Vários grupos de indivíduos diferentes, testados de uma vez: um teste por par inflaria o erro tipo I.'
  - nome: 'Três ou mais medidas repetidas'
    dica: 'Os mesmos indivíduos medidos em três ou mais condições ou momentos: o pareado com mais de duas medidas.'
  - nome: 'Comparações múltiplas'
    dica: 'Pós-testes: depois de rejeitar a igualdade de todos os grupos, apontam quais pares diferem, controlando o erro do conjunto de comparações.'
faixas: [ader, assoc, modelos, series]

testes:

  # ------------------------------------------------------------------ médias
  - id: t-uma-amostra
    sym: 't₁'
    nome: 't para uma amostra'
    fam: medias
    row: 1
    col: 1
    dist: 't(n−1)'
    quando: 'Comparar a média de uma amostra com um valor de referência quando o desvio padrão da população é desconhecido.'
    h0: 'A média populacional é igual ao valor de referência: μ = μ₀.'
    pres:
      - 'Observações independentes'
      - 'Dados aproximadamente normais, ou n grande (≳ 30)'
    tex: 't = \dfrac{\bar{x} - \mu_0}{s / \sqrt{n}}'
    efeito:
      texto: 'd de Cohen: a diferença em desvios padrão. Referências usuais: 0,2 pequeno, 0,5 médio e 0,8 grande.'
      tex: 'd = \dfrac{\bar{x} - \mu_0}{s}'
    vars:
      - ['Teste Z, quando σ é conhecido', null]
      - ['Teste do sinal, sem supor normalidade', sinal]
    page: t-student
    veja: [intervalo-confianca, teorema-central-limite]
    reporte: 't(24) = 2,31; p = 0,030; d = 0,46'
    codigo:
      r: |
        t.test(x, mu = 50)
      py: |
        stats.ttest_1samp(x, popmean=50)
  - id: t-independente
    sym: 't₂'
    nome: 't para duas amostras independentes'
    fam: medias
    row: 2
    col: 1
    dist: 't(gl)'
    quando: 'Comparar as médias de dois grupos diferentes, como tratamento e controle.'
    h0: 'As duas médias populacionais são iguais: μ₁ = μ₂.'
    pres:
      - 'Grupos independentes entre si'
      - 'Normalidade em cada grupo, ou amostras grandes'
    tex: 't = \dfrac{\bar{x}_1 - \bar{x}_2}{\sqrt{s_1^2/n_1 + s_2^2/n_2}}'
    efeito:
      texto: 'd de Cohen com o desvio padrão combinado; o g de Hedges corrige o viés em amostras pequenas.'
      tex: 'd = \dfrac{\bar{x}_1 - \bar{x}_2}{s_p}, \qquad s_p = \sqrt{\dfrac{(n_1 - 1)s_1^2 + (n_2 - 1)s_2^2}{n_1 + n_2 - 2}}'
    vars:
      - ['Welch (acima): não supõe variâncias iguais e é o padrão recomendado', null]
      - ['Student clássico, com variância combinada, se as variâncias forem iguais', null]
      - ['Mann-Whitney U, sem supor normalidade', mann-whitney]
      - ['TOST (dois testes t unilaterais), para mostrar equivalência dentro de uma margem em vez de diferença', null]
    reporte: 't(37,8) = 2,15; p = 0,038; d = 0,68 (Welch)'
    codigo:
      r: |
        t.test(y ~ grupo, data = dados)  # Welch é o padrão
      py: |
        stats.ttest_ind(a, b, equal_var=False)  # Welch
  - id: t-pareado
    sym: 'tₚ'
    nome: 't pareado'
    fam: medias
    row: 3
    col: 1
    dist: 't(n−1)'
    quando: 'Comparar duas medidas feitas nos mesmos indivíduos, como antes e depois de uma intervenção.'
    h0: 'A média das diferenças é zero: μ_d = 0.'
    pres:
      - 'Pares independentes entre si'
      - 'Diferenças aproximadamente normais'
    tex: 't = \dfrac{\bar{d}}{s_d / \sqrt{n}}'
    efeito:
      texto: 'd_z, na escala das diferenças.'
      tex: 'd_z = \dfrac{\bar{d}}{s_d}'
    vars:
      - ['Wilcoxon de postos sinalizados, sem supor normalidade', wilcoxon]
    reporte: 't(14) = 3,02; p = 0,009; d_z = 0,78'
    codigo:
      r: |
        t.test(depois, antes, paired = TRUE)
      py: |
        stats.ttest_rel(depois, antes)
  - id: anova
    sym: 'F'
    nome: 'ANOVA de um fator'
    fam: medias
    row: 4
    col: 1
    dist: 'F(k−1, N−k)'
    quando: 'Comparar as médias de três ou mais grupos independentes de uma vez, sem inflar o erro tipo I com vários testes t.'
    h0: 'Todas as médias são iguais: μ₁ = μ₂ = … = μₖ.'
    pres:
      - 'Grupos independentes'
      - 'Normalidade dos resíduos'
      - 'Variâncias iguais (confira com Levene)'
    tex: 'F = \dfrac{QM_{\text{entre}}}{QM_{\text{dentro}}}'
    efeito:
      texto: 'η²: a fração da variação total explicada pelos grupos. O ω² é menos viesado. Referências: 0,01, 0,06 e 0,14.'
      tex: '\eta^2 = \dfrac{SQ_{\text{entre}}}{SQ_{\text{total}}}'
    vars:
      - ['ANOVA de Welch, quando as variâncias diferem', null]
      - ['Kruskal-Wallis, sem supor normalidade', kruskal-wallis]
      - ['Depois de rejeitar H₀', tukey]
      - ['Com dois fatores e a interação entre eles', anova-dois-fatores]
    reporte: 'F(2, 42) = 4,87; p = 0,013; η² = 0,19'
    codigo:
      r: |
        summary(aov(y ~ grupo, data = dados))
      py: |
        stats.f_oneway(a, b, c)
  - id: anova-mr
    sym: 'Fᵣ'
    nome: 'ANOVA de medidas repetidas'
    fam: medias
    row: 5
    col: 1
    dist: 'F'
    quando: 'Comparar três ou mais condições medidas nos mesmos indivíduos, como em vários momentos de um acompanhamento.'
    h0: 'As médias de todas as condições são iguais.'
    pres:
      - 'Normalidade dos resíduos'
      - 'Esfericidade (confira com Mauchly)'
    tex: 'F = \dfrac{QM_{\text{condições}}}{QM_{\text{erro}}}'
    efeito:
      texto: 'η² parcial: a variação das condições relativa a ela mais o erro.'
      tex: '\eta^2_p = \dfrac{SQ_{\text{condições}}}{SQ_{\text{condições}} + SQ_{\text{erro}}}'
    vars:
      - ['Correções de Greenhouse-Geisser ou Huynh-Feldt, se a esfericidade falhar', null]
      - ['Friedman, sem supor normalidade', friedman]
      - ['Esfericidade de Mauchly, para conferir o pressuposto', mauchly]
    reporte: 'F(2, 38) = 6,12; p = 0,005; η²p = 0,24 (com correção de Greenhouse-Geisser, informe os gl corrigidos)'
    codigo:
      r: |
        library(afex)
        aov_ez("id", "y", dados, within = "tempo")
      py: |
        from statsmodels.stats.anova import AnovaRM
        AnovaRM(dados, "y", "id", within=["tempo"]).fit()
  - id: tukey
    sym: 'Tk'
    nome: 'Tukey HSD'
    fam: medias
    row: 6
    col: 1
    dist: 'q (amplitude studentizada)'
    quando: 'Depois de uma ANOVA significativa, descobrir quais pares de grupos diferem, controlando o erro do conjunto de comparações.'
    h0: 'Para cada par: μᵢ = μⱼ.'
    pres:
      - 'Os mesmos da ANOVA'
      - 'Grupos de tamanhos parecidos (Tukey-Kramer ajusta os desiguais)'
    tex: 'q = \dfrac{\bar{x}_i - \bar{x}_j}{\sqrt{QM_{\text{dentro}} / n}}'
    efeito:
      texto: 'd de Cohen para cada par, com o desvio padrão estimado pela ANOVA.'
      tex: 'd_{ij} = \dfrac{\bar{x}_i - \bar{x}_j}{\sqrt{QM_{\text{dentro}}}}'
    vars:
      - ['Games-Howell, com variâncias diferentes', null]
      - ['Dunnett, comparando todos contra um controle', null]
      - ['Bonferroni, mais conservador e geral', null]

  # ------------------------------------------------------------------ postos
    reporte: 'B − A = 4,2; IC 95% [1,1; 7,3]; p ajustado = 0,006'
    codigo:
      r: |
        TukeyHSD(aov(y ~ grupo, data = dados))
      py: |
        from statsmodels.stats.multicomp import pairwise_tukeyhsd
        pairwise_tukeyhsd(dados["y"], dados["grupo"])
  - id: sinal
    sym: 'Sg'
    nome: 'Teste do sinal'
    fam: postos
    row: 1
    col: 2
    dist: 'Binomial(n, ½)'
    quando: 'Testar a mediana de uma amostra sem supor nada sobre a forma da distribuição; usa só se cada valor está acima ou abaixo.'
    h0: 'A mediana populacional é igual a m₀.'
    pres:
      - 'Observações independentes'
      - 'Variável ao menos ordinal'
    tex: 'S = \#\{\, x_i > m_0 \,\} \sim \text{Bin}\left(n, \tfrac{1}{2}\right)'
    efeito:
      texto: 'g de Cohen: quanto a proporção de sinais positivos se afasta de ½.'
      tex: 'g = \hat{p} - \tfrac{1}{2}'
    vars:
      - ['Wilcoxon de postos sinalizados, mais poderoso se a distribuição for simétrica', wilcoxon]
    veja: [distribuicao-binomial]
    reporte: '15 de 20 acima do valor de referência; teste do sinal, p = 0,041'
    codigo:
      r: |
        binom.test(sum(x > m0), sum(x != m0), p = 0.5)
      py: |
        stats.binomtest(int((x > m0).sum()), int((x != m0).sum()), p=0.5)
  - id: mann-whitney
    sym: 'U'
    nome: 'Mann-Whitney U'
    fam: postos
    row: 2
    col: 2
    dist: 'U (normal para n grande)'
    quando: 'Comparar dois grupos independentes quando os dados não são normais, têm valores extremos ou são ordinais.'
    h0: 'Um valor sorteado de um grupo tem a mesma chance de ser maior ou menor que um do outro.'
    pres:
      - 'Grupos independentes'
      - 'Variável ao menos ordinal'
    tex: 'U = n_1 n_2 + \dfrac{n_1(n_1 + 1)}{2} - R_1'
    efeito:
      texto: 'r, a partir do z da aproximação normal (N é o total das duas amostras); a correlação rank-bisserial é outra opção.'
      tex: 'r = \dfrac{|z|}{\sqrt{N}}'
    vars:
      - ['Também chamado de Wilcoxon rank-sum', null]
      - ['Versão paramétrica', t-independente]
    reporte: 'U = 112; z = −2,38; p = 0,017; r = 0,38'
    codigo:
      r: |
        wilcox.test(y ~ grupo, data = dados)
      py: |
        stats.mannwhitneyu(a, b, alternative="two-sided")
  - id: wilcoxon
    sym: 'W'
    nome: 'Wilcoxon de postos sinalizados'
    fam: postos
    row: 3
    col: 2
    dist: 'W (normal para n grande)'
    quando: 'Comparar duas medidas pareadas sem supor normalidade das diferenças.'
    h0: 'A distribuição das diferenças é simétrica em torno de zero.'
    pres:
      - 'Pares independentes'
      - 'Diferenças com distribuição simétrica'
    tex: 'W = \sum_{d_i > 0} \operatorname{posto}(|d_i|)'
    efeito:
      texto: 'r, a partir do z da aproximação normal (n é o número de pares).'
      tex: 'r = \dfrac{|z|}{\sqrt{n}}'
    vars:
      - ['Teste do sinal, se nem a simetria for razoável', sinal]
      - ['Versão paramétrica', t-pareado]
    reporte: 'V = 21; z = −2,21; p = 0,027; r = 0,57'
    codigo:
      r: |
        wilcox.test(depois, antes, paired = TRUE)
      py: |
        stats.wilcoxon(depois, antes)
  - id: kruskal-wallis
    sym: 'H'
    nome: 'Kruskal-Wallis'
    fam: postos
    row: 4
    col: 2
    dist: 'χ²(k−1)'
    quando: 'Comparar três ou mais grupos independentes sem supor normalidade: é a ANOVA feita sobre postos.'
    h0: 'Todos os grupos vêm da mesma distribuição.'
    pres:
      - 'Grupos independentes'
      - 'Variável ao menos ordinal'
    tex: 'H = \dfrac{12}{N(N+1)} \sum_j \dfrac{R_j^2}{n_j} - 3(N+1)'
    efeito:
      texto: 'ε²: a versão por postos do η².'
      tex: '\varepsilon^2 = \dfrac{H}{N - 1}'
    vars:
      - ['Depois de rejeitar H₀', dunn]
      - ['Versão paramétrica', anova]
    reporte: 'H(2) = 8,43; p = 0,015; ε² = 0,19'
    codigo:
      r: |
        kruskal.test(y ~ grupo, data = dados)
      py: |
        stats.kruskal(a, b, c)
  - id: friedman
    sym: 'Fr'
    nome: 'Friedman'
    fam: postos
    row: 5
    col: 2
    dist: 'χ²(k−1)'
    quando: 'Comparar três ou mais condições medidas nos mesmos indivíduos sem supor normalidade.'
    h0: 'As condições têm a mesma distribuição.'
    pres:
      - 'Blocos (indivíduos) independentes'
      - 'Variável ao menos ordinal'
    tex: '\chi^2_F = \dfrac{12}{nk(k+1)} \sum_j R_j^2 - 3n(k+1)'
    efeito:
      texto: 'W de Kendall: a concordância entre os blocos, de 0 a 1.'
      tex: 'W = \dfrac{\chi^2_F}{n(k - 1)}'
    vars:
      - ['Pós-teste de Nemenyi ou Conover', null]
      - ['Versão paramétrica', anova-mr]
    reporte: 'χ²F(2) = 9,10; p = 0,011; W de Kendall = 0,23'
    codigo:
      r: |
        friedman.test(y ~ tempo | id, data = dados)
      py: |
        stats.friedmanchisquare(t1, t2, t3)
  - id: dunn
    sym: 'Dn'
    nome: 'Teste de Dunn'
    fam: postos
    row: 6
    col: 2
    dist: 'N(0, 1)'
    quando: 'Depois de um Kruskal-Wallis significativo, descobrir quais pares de grupos diferem.'
    h0: 'Para cada par, os postos médios são iguais.'
    pres:
      - 'Os mesmos do Kruskal-Wallis'
    tex: 'z = \dfrac{\bar{R}_i - \bar{R}_j}{\sqrt{\dfrac{N(N+1)}{12}\left(\dfrac{1}{n_i} + \dfrac{1}{n_j}\right)}}'
    efeito:
      texto: 'r para cada par, a partir do z do teste.'
      tex: 'r = \dfrac{|z|}{\sqrt{n_i + n_j}}'
    vars:
      - ['Ajuste os valores-p das comparações (Bonferroni, Holm)', null]
      - ['Conover-Iman, um pouco mais poderoso', null]

  # ------------------------------------------------------------------ proporções
    reporte: 'B − A: z = 2,74; p ajustado (Holm) = 0,018'
    codigo:
      r: |
        library(FSA)
        dunnTest(y ~ grupo, data = dados, method = "holm")
      py: |
        import scikit_posthocs as sp
        sp.posthoc_dunn(dados, val_col="y", group_col="grupo", p_adjust="holm")
  - id: binomial
    sym: 'Bi'
    nome: 'Binomial / Z para uma proporção'
    fam: prop
    row: 1
    col: 3
    dist: 'Binomial ou N(0, 1)'
    quando: 'Comparar a proporção de uma amostra com um valor de referência, como a taxa de aprovação contra 50%.'
    h0: 'A proporção populacional é p₀.'
    pres:
      - 'Observações independentes'
      - 'Para o Z: np₀ e n(1 − p₀) pelo menos 10; senão, use o binomial exato'
    tex: 'z = \dfrac{\hat{p} - p_0}{\sqrt{p_0(1 - p_0)/n}}'
    efeito:
      texto: 'h de Cohen: a diferença entre as proporções na escala do arco-seno. Referências: 0,2, 0,5 e 0,8.'
      tex: 'h = 2\arcsin\sqrt{\hat{p}} - 2\arcsin\sqrt{p_0}'
    vars:
      - ['Teste binomial exato, para amostras pequenas', null]
    veja: [distribuicao-binomial]
    reporte: '62 de 100 (62%); teste binomial contra 50%, p = 0,021; h = 0,24'
    codigo:
      r: |
        binom.test(62, 100, p = 0.5)  # exato; prop.test() faz o Z
      py: |
        stats.binomtest(62, 100, p=0.5)
  - id: z-duas-proporcoes
    sym: 'Z₂'
    nome: 'Z para duas proporções'
    fam: prop
    row: 2
    col: 3
    dist: 'N(0, 1)'
    quando: 'Comparar a proporção de sucesso em dois grupos independentes, como a conversão de duas versões de uma página.'
    h0: 'As duas proporções são iguais: p₁ = p₂.'
    pres:
      - 'Grupos independentes'
      - 'Pelo menos 5 a 10 sucessos e fracassos em cada grupo'
    tex: 'z = \dfrac{\hat{p}_1 - \hat{p}_2}{\sqrt{\hat{p}(1 - \hat{p})\left(\frac{1}{n_1} + \frac{1}{n_2}\right)}}'
    efeito:
      texto: 'h de Cohen; também se reportam a diferença de proporções, o risco relativo e a razão de chances.'
      tex: 'h = 2\arcsin\sqrt{\hat{p}_1} - 2\arcsin\sqrt{\hat{p}_2}'
    vars:
      - ['Qui-quadrado de independência, equivalente numa tabela 2 × 2', qui-quadrado-independencia]
      - ['Fisher exato, com contagens pequenas', fisher]
    reporte: '45% contra 30%; z = 2,19; p = 0,029; h = 0,31'
    codigo:
      r: |
        prop.test(c(45, 30), c(100, 100), correct = FALSE)
      py: |
        from statsmodels.stats.proportion import proportions_ztest
        proportions_ztest([45, 30], [100, 100])
  - id: mcnemar
    sym: 'Mc'
    nome: 'McNemar'
    fam: prop
    row: 3
    col: 3
    dist: 'χ²(1)'
    quando: 'Comparar uma proporção medida duas vezes nos mesmos indivíduos, como a opinião antes e depois de uma campanha.'
    h0: 'A proporção não mudou: as trocas num sentido e no outro são igualmente prováveis.'
    pres:
      - 'Resposta binária pareada'
      - 'b + c não muito pequeno (senão, versão exata)'
    tex: '\chi^2 = \dfrac{(b - c)^2}{b + c}'
    efeito:
      texto: 'Razão de chances pareada: quantas vezes uma troca é mais comum que a outra.'
      tex: 'OR = \dfrac{b}{c}'
    vars:
      - ['Versão exata binomial, para b + c pequeno', null]
    reporte: 'b = 18, c = 6; χ²(1) = 6,00; p = 0,014; OR = 3,0'
    codigo:
      r: |
        mcnemar.test(tabela, correct = FALSE)
      py: |
        from statsmodels.stats.contingency_tables import mcnemar
        mcnemar(tabela, exact=False, correction=False)
  - id: qui-quadrado-homogeneidade
    sym: 'χ²ₕ'
    nome: 'Qui-quadrado de homogeneidade'
    fam: prop
    row: 4
    col: 3
    dist: 'χ²((r−1)(c−1))'
    quando: 'Comparar a distribuição de uma variável categórica entre três ou mais grupos independentes.'
    h0: 'As proporções de cada categoria são as mesmas em todos os grupos.'
    pres:
      - 'Observações independentes'
      - 'Frequências esperadas de pelo menos 5'
    tex: '\chi^2 = \sum \dfrac{(O - E)^2}{E}'
    efeito:
      texto: 'V de Cramér, de 0 a 1.'
      tex: 'V = \sqrt{\dfrac{\chi^2}{N\,(\min(r, c) - 1)}}'
    vars:
      - ['Qui-quadrado de independência, que usa a mesma conta', qui-quadrado-independencia]
      - ['Depois de rejeitar H₀', marascuilo]
    veja: [qui-quadrado]
    reporte: 'χ²(4, N = 300) = 11,2; p = 0,024; V = 0,14'
    codigo:
      r: |
        chisq.test(tabela)
      py: |
        stats.chi2_contingency(tabela)
  - id: cochran-q
    sym: 'Q'
    nome: 'Q de Cochran'
    fam: prop
    row: 5
    col: 3
    dist: 'χ²(k−1)'
    quando: 'Comparar uma proporção medida em três ou mais condições nos mesmos indivíduos, como acertos em várias provas.'
    h0: 'A proporção de sucesso é igual em todas as condições.'
    pres:
      - 'Resposta binária'
      - 'Blocos (indivíduos) independentes'
    tex: 'Q = \dfrac{(k - 1)\left[k \sum_j C_j^2 - N^2\right]}{kN - \sum_i R_i^2}'
    vars:
      - ['McNemar, o caso com duas condições', mcnemar]
    reporte: 'Q(2) = 7,6; p = 0,022'
    codigo:
      r: |
        library(rstatix)
        cochran_qtest(dados, resposta ~ condicao | id)
      py: |
        from statsmodels.stats.contingency_tables import cochrans_q
        cochrans_q(matriz)  # linhas = indivíduos, colunas = condições
  - id: marascuilo
    sym: 'Ms'
    nome: 'Marascuilo'
    fam: prop
    row: 6
    col: 3
    dist: 'χ²(k−1)'
    quando: 'Depois de um qui-quadrado de homogeneidade significativo entre três ou mais grupos, descobrir quais pares de proporções diferem.'
    h0: 'Para cada par: pᵢ = pⱼ.'
    pres:
      - 'Os mesmos do qui-quadrado de homogeneidade'
      - 'Resposta binária em cada grupo'
    tex: '|\hat{p}_i - \hat{p}_j| > \sqrt{\chi^2_{\alpha;\,k-1}} \, \sqrt{\dfrac{\hat{p}_i(1 - \hat{p}_i)}{n_i} + \dfrac{\hat{p}_j(1 - \hat{p}_j)}{n_j}}'
    vars:
      - ['Com medidas repetidas, McNemar par a par com ajuste dos valores-p', mcnemar]

  # ------------------------------------------------------------------ variâncias
    reporte: 'A − C: |0,42 − 0,25| = 0,17, acima do valor crítico de 0,15: diferem a 5%'
    codigo:
      r: |
        # sem função padrão: compare cada |p[i] - p[j]| com
        sqrt(qchisq(0.95, k - 1)) * sqrt(p[i]*(1-p[i])/n[i] + p[j]*(1-p[j])/n[j])
      py: |
        # sem função padrão: compare cada |p[i] - p[j]| com
        np.sqrt(stats.chi2.ppf(0.95, k - 1)) * np.sqrt(p[i]*(1-p[i])/n[i] + p[j]*(1-p[j])/n[j])
  - id: qui-quadrado-variancia
    sym: 'χ²ᵥ'
    nome: 'Qui-quadrado para uma variância'
    fam: vari
    row: 1
    col: 4
    dist: 'χ²(n−1)'
    quando: 'Testar se a variância de um processo está no valor especificado, como no controle de qualidade.'
    h0: 'A variância populacional é σ₀².'
    pres:
      - 'Dados normais: o teste é muito sensível a desvios de normalidade'
    tex: '\chi^2 = \dfrac{(n - 1)\, s^2}{\sigma_0^2}'
    vars: []
    reporte: 'χ²(24) = 38,9; p = 0,056'
    codigo:
      r: |
        library(EnvStats)
        varTest(x, sigma.squared = 4)
      py: |
        q = (len(x) - 1) * x.var(ddof=1) / 4
        p = 2 * min(stats.chi2.cdf(q, len(x) - 1), stats.chi2.sf(q, len(x) - 1))
  - id: f-variancias
    sym: 'Fᵥ'
    nome: 'F para duas variâncias'
    fam: vari
    row: 2
    col: 4
    dist: 'F(n₁−1, n₂−1)'
    quando: 'Comparar a dispersão de dois grupos independentes.'
    h0: 'As variâncias são iguais: σ₁² = σ₂².'
    pres:
      - 'Grupos independentes'
      - 'Dados normais (frágil sem isso)'
    tex: 'F = \dfrac{s_1^2}{s_2^2}'
    vars:
      - ['Levene, robusto à falta de normalidade', levene]
      - ['Pitman-Morgan, com amostras pareadas', pitman-morgan]
    reporte: 'F(15, 20) = 2,22; p = 0,097'
    codigo:
      r: |
        var.test(a, b)
      py: |
        f = a.var(ddof=1) / b.var(ddof=1)
        p = 2 * min(stats.f.cdf(f, len(a) - 1, len(b) - 1), stats.f.sf(f, len(a) - 1, len(b) - 1))
  - id: pitman-morgan
    sym: 'PM'
    nome: 'Pitman-Morgan'
    fam: vari
    row: 3
    col: 4
    dist: 't(n−2)'
    quando: 'Comparar as variâncias de duas medidas pareadas, como a precisão de dois instrumentos aplicados às mesmas amostras.'
    h0: 'As duas variâncias são iguais: σ₁² = σ₂².'
    pres:
      - 'Pares independentes entre si'
      - 'Normalidade bivariada'
    tex: 'r = \operatorname{corr}(x - y,\; x + y), \qquad t = \dfrac{r\sqrt{n - 2}}{\sqrt{1 - r^2}}'
    vars:
      - ['F para duas variâncias, com amostras independentes', f-variancias]
    reporte: 'r(D, S) = 0,48; t(18) = 2,32; p = 0,032'
    codigo:
      r: |
        cor.test(x - y, x + y)
      py: |
        stats.pearsonr(x - y, x + y)
  - id: levene
    sym: 'Lv'
    nome: 'Levene'
    fam: vari
    row: 4
    col: 4
    dist: 'F(k−1, N−k)'
    quando: 'Verificar se dois ou mais grupos têm a mesma variância, por exemplo antes de uma ANOVA.'
    h0: 'Todas as variâncias são iguais.'
    pres:
      - 'Grupos independentes'
    tex: 'W = \dfrac{(N - k) \sum_j n_j (\bar{Z}_j - \bar{Z})^2}{(k - 1) \sum_j \sum_i (Z_{ij} - \bar{Z}_j)^2}'
    vars:
      - ['Brown-Forsythe, com desvios da mediana (mais robusto)', null]
      - ['Bartlett, mais poderoso mas exige normalidade', null]
    reporte: 'F(2, 42) = 1,36; p = 0,27'
    codigo:
      r: |
        library(car)
        leveneTest(y ~ grupo, data = dados, center = mean)  # center = median é o Brown-Forsythe
      py: |
        stats.levene(a, b, c, center="mean")  # "median" é o Brown-Forsythe
  - id: mauchly
    sym: 'Mw'
    nome: 'Esfericidade de Mauchly'
    fam: vari
    row: 5
    col: 4
    dist: 'χ²'
    quando: 'Verificar a esfericidade antes de uma ANOVA de medidas repetidas: as variâncias das diferenças entre condições devem ser iguais.'
    h0: 'A matriz de covariâncias é esférica.'
    pres:
      - 'Normalidade multivariada'
      - 'Pelo menos três condições'
    tex: 'W = \dfrac{\det(\mathbf{S})}{\left(\operatorname{tr}(\mathbf{S}) / p\right)^p}'
    vars:
      - ['ANOVA de medidas repetidas, com correção de Greenhouse-Geisser ou Huynh-Feldt se a esfericidade falhar', anova-mr]

  # ------------------------------------------------------------------ aderência e normalidade
    reporte: 'W = 0,71; χ²(2) = 6,2; p = 0,045; ε de Greenhouse-Geisser = 0,78'
    codigo:
      r: |
        library(afex)
        summary(aov_ez("id", "y", dados, within = "tempo"))  # traz o Mauchly
      py: |
        import pingouin as pg
        pg.sphericity(dados, dv="y", subject="id", within="tempo")
  - id: shapiro-wilk
    sym: 'SW'
    nome: 'Shapiro-Wilk'
    fam: ader
    strip: 1
    pos: 1
    dist: 'W (tabelada)'
    quando: 'Verificar se uma amostra vem de uma distribuição normal; é o teste de normalidade mais poderoso para amostras pequenas e médias.'
    h0: 'Os dados vêm de uma distribuição normal.'
    pres:
      - 'Observações independentes'
      - 'Com n muito grande, rejeita desvios irrelevantes: olhe também o gráfico Q-Q'
    tex: 'W = \dfrac{\left(\sum a_i\, x_{(i)}\right)^2}{\sum (x_i - \bar{x})^2}'
    vars: []
    veja: [distribuicao-normal]
    reporte: 'W = 0,96; p = 0,31'
    codigo:
      r: |
        shapiro.test(x)
      py: |
        stats.shapiro(x)
  - id: kolmogorov-smirnov
    sym: 'KS'
    nome: 'Kolmogorov-Smirnov'
    fam: ader
    strip: 1
    pos: 2
    dist: 'D (Kolmogorov)'
    quando: 'Comparar uma amostra com uma distribuição teórica totalmente especificada.'
    h0: 'Os dados seguem a distribuição F₀.'
    pres:
      - 'F₀ contínua e com parâmetros conhecidos de antemão'
    tex: 'D = \sup_x \left| F_n(x) - F_0(x) \right|'
    vars:
      - ['Lilliefors, quando os parâmetros são estimados dos dados', lilliefors]
      - ['Versão para duas amostras, que compara as duas distribuições empíricas: D = sup |F₁(x) − F₂(x)|', null]
    reporte: 'D = 0,12; p = 0,43'
    codigo:
      r: |
        ks.test(x, "pnorm", mean = 0, sd = 1)
      py: |
        stats.kstest(x, "norm", args=(0, 1))
  - id: anderson-darling
    sym: 'AD'
    nome: 'Anderson-Darling'
    fam: ader
    strip: 1
    pos: 3
    dist: 'A² (tabelada)'
    quando: 'Testar aderência a uma distribuição dando mais peso às caudas que o Kolmogorov-Smirnov.'
    h0: 'Os dados seguem a distribuição F.'
    pres:
      - 'Observações independentes'
    tex: 'A^2 = -n - \dfrac{1}{n} \sum_{i=1}^{n} (2i - 1)\left[\ln F(x_{(i)}) + \ln\left(1 - F(x_{(n+1-i)})\right)\right]'
    vars: []
    reporte: 'A² = 0,52; p = 0,18'
    codigo:
      r: |
        library(nortest)
        ad.test(x)
      py: |
        stats.anderson(x, dist="norm")  # devolve valores críticos, não o p
  - id: qui-quadrado-aderencia
    sym: 'χ²ₐ'
    nome: 'Qui-quadrado de aderência'
    fam: ader
    strip: 1
    pos: 4
    dist: 'χ²(k−1)'
    quando: 'Verificar se as frequências observadas em categorias batem com as esperadas por uma teoria, como um dado honesto.'
    h0: 'As proporções das categorias são as especificadas.'
    pres:
      - 'Observações independentes'
      - 'Frequências esperadas de pelo menos 5'
    tex: '\chi^2 = \sum_i \dfrac{(O_i - E_i)^2}{E_i}'
    vars: []
    page: qui-quadrado
    reporte: 'χ²(5, N = 120) = 4,8; p = 0,44'
    codigo:
      r: |
        chisq.test(observado, p = proporcoes_esperadas)
      py: |
        stats.chisquare(observado, f_exp=esperado)
  - id: jarque-bera
    sym: 'JB'
    nome: 'Jarque-Bera'
    fam: ader
    strip: 1
    pos: 5
    dist: 'χ²(2)'
    quando: 'Testar normalidade pela assimetria e pela curtose; comum em econometria, com amostras grandes.'
    h0: 'Assimetria zero e curtose 3, como na normal.'
    pres:
      - 'Amostras grandes: em amostras pequenas o teste é pouco confiável'
    tex: 'JB = \dfrac{n}{6}\left(S^2 + \dfrac{(K - 3)^2}{4}\right)'
    vars: []
    veja: [distribuicao-normal]
    reporte: 'JB = 3,1; p = 0,21'
    codigo:
      r: |
        library(tseries)
        jarque.bera.test(x)
      py: |
        stats.jarque_bera(x)
  - id: lilliefors
    sym: 'Lf'
    nome: 'Lilliefors'
    fam: ader
    strip: 1
    pos: 6
    dist: 'D (Lilliefors)'
    quando: 'Testar normalidade quando a média e o desvio padrão são estimados da própria amostra.'
    h0: 'Os dados vêm de alguma distribuição normal.'
    pres:
      - 'Observações independentes'
    tex: 'D = \sup_x \left| F_n(x) - \Phi\!\left(\dfrac{x - \bar{x}}{s}\right) \right|'
    vars:
      - ['Kolmogorov-Smirnov com valores críticos corrigidos', kolmogorov-smirnov]
    reporte: 'D = 0,09; p = 0,38'
    codigo:
      r: |
        library(nortest)
        lillie.test(x)
      py: |
        from statsmodels.stats.diagnostic import lilliefors
        lilliefors(x)
  - id: grubbs
    sym: 'Gr'
    nome: 'Grubbs'
    fam: ader
    strip: 1
    pos: 7
    dist: 'G (crítico via t)'
    quando: 'Verificar se o valor mais extremo de uma amostra é um outlier, isto é, distante demais para vir da mesma distribuição normal que os outros.'
    h0: 'Não há outlier: todos os valores vêm da mesma distribuição normal.'
    pres:
      - 'Dados normais, fora o possível outlier'
      - 'Procura um outlier por vez: repetir o teste depois de remover um infla o erro tipo I'
    tex: 'G = \dfrac{\max_i |x_i - \bar{x}|}{s}'
    vars:
      - ['Dixon (Q), para amostras muito pequenas', null]
      - ['ESD generalizado de Rosner, para procurar vários outliers de uma vez', null]

  # ------------------------------------------------------------------ associação e correlação
    veja: [distribuicao-normal]
    reporte: 'G = 2,91; n = 20; p = 0,017: o maior valor é um outlier'
    codigo:
      r: |
        library(outliers)
        grubbs.test(x)
      py: |
        n = len(x)
        G = np.abs(x - x.mean()).max() / x.std(ddof=1)
        t = stats.t.ppf(1 - 0.05 / (2 * n), n - 2)
        G_crit = (n - 1) / np.sqrt(n) * np.sqrt(t**2 / (n - 2 + t**2))
  - id: pearson
    sym: 'r'
    nome: 'Correlação de Pearson'
    fam: assoc
    strip: 2
    pos: 1
    dist: 't(n−2)'
    quando: 'Medir e testar a relação linear entre duas variáveis quantitativas.'
    h0: 'Não há correlação linear: ρ = 0.'
    pres:
      - 'Relação linear'
      - 'Normalidade bivariada (para o teste)'
      - 'Sem valores extremos influentes'
    tex: 't = \dfrac{r\sqrt{n - 2}}{\sqrt{1 - r^2}}'
    efeito:
      texto: 'O próprio r; r² é a fração da variância de uma variável explicada pela outra.'
    vars:
      - ['Correlação de Spearman, para relações monotônicas ou dados ordinais', spearman]
    page: coeficiente-pearson
    veja: [covariancia]
    reporte: 'r(28) = 0,42; p = 0,021'
    codigo:
      r: |
        cor.test(x, y)
      py: |
        stats.pearsonr(x, y)
  - id: spearman
    sym: 'ρ'
    nome: 'Correlação de Spearman'
    fam: assoc
    strip: 2
    pos: 2
    dist: 't(n−2) aprox.'
    quando: 'Medir a relação monotônica entre duas variáveis, mesmo não linear ou ordinal: é o Pearson calculado sobre os postos.'
    h0: 'Não há associação monotônica.'
    pres:
      - 'Variáveis ao menos ordinais'
      - 'Pares independentes'
    tex: '\rho = 1 - \dfrac{6 \sum d_i^2}{n(n^2 - 1)}'
    efeito:
      texto: 'O próprio ρ.'
    vars:
      - ['Tau de Kendall, mais estável com amostras pequenas e empates', kendall]
    veja: [coeficiente-pearson]
    reporte: 'ρ = 0,51; n = 30; p = 0,004'
    codigo:
      r: |
        cor.test(x, y, method = "spearman")
      py: |
        stats.spearmanr(x, y)
  - id: kendall
    sym: 'τ'
    nome: 'Tau de Kendall'
    fam: assoc
    strip: 2
    pos: 3
    dist: 'N(0, 1) aprox.'
    quando: 'Medir a concordância de ordem entre duas variáveis, contando pares concordantes e discordantes.'
    h0: 'Não há associação: τ = 0.'
    pres:
      - 'Variáveis ao menos ordinais'
    tex: '\tau_a = \dfrac{C - D}{\binom{n}{2}}'
    efeito:
      texto: 'O próprio τ.'
    vars:
      - ['Tau-b, que corrige os empates no denominador e é o que a maioria dos programas calcula', null]
    reporte: 'τ = 0,33; n = 30; p = 0,010'
    codigo:
      r: |
        cor.test(x, y, method = "kendall")
      py: |
        stats.kendalltau(x, y)
  - id: qui-quadrado-independencia
    sym: 'χ²ᵢ'
    nome: 'Qui-quadrado de independência'
    fam: assoc
    strip: 2
    pos: 4
    dist: 'χ²((r−1)(c−1))'
    quando: 'Verificar se duas variáveis categóricas estão associadas, numa tabela de contingência.'
    h0: 'As duas variáveis são independentes.'
    pres:
      - 'Observações independentes'
      - 'Frequências esperadas de pelo menos 5'
    tex: '\chi^2 = \sum_{i,j} \dfrac{(O_{ij} - E_{ij})^2}{E_{ij}}, \qquad E_{ij} = \dfrac{R_i\, C_j}{N}'
    efeito:
      texto: 'V de Cramér, de 0 a 1; numa tabela 2 × 2, é o φ.'
      tex: 'V = \sqrt{\dfrac{\chi^2}{N\,(\min(r, c) - 1)}}'
    vars:
      - ['Fisher exato, para tabelas 2 × 2 com contagens pequenas', fisher]
      - ['V de Cramér, para medir a força da associação', null]
    veja: [qui-quadrado]
    reporte: 'χ²(2, N = 200) = 7,4; p = 0,025; V = 0,19'
    codigo:
      r: |
        chisq.test(table(dados$a, dados$b))
      py: |
        stats.chi2_contingency(pd.crosstab(dados["a"], dados["b"]))
  - id: fisher
    sym: 'Fe'
    nome: 'Fisher exato'
    fam: assoc
    strip: 2
    pos: 5
    dist: 'Hipergeométrica'
    quando: 'Testar associação numa tabela 2 × 2 com contagens pequenas, onde o qui-quadrado não vale.'
    h0: 'As duas variáveis são independentes.'
    pres:
      - 'Totais das margens fixos (ou tratados como fixos): o valor-p soma as tabelas com essas margens tão ou menos prováveis que a observada'
    tex: 'P(T) = \dfrac{\binom{a+b}{a}\binom{c+d}{c}}{\binom{n}{a+c}}, \qquad p = \sum_{P(T'') \,\le\, P(T_{\text{obs}})} P(T'')'
    efeito:
      texto: 'Razão de chances da tabela 2 × 2.'
      tex: 'OR = \dfrac{a\,d}{b\,c}'
    vars:
      - ['Qui-quadrado de independência, com contagens maiores', qui-quadrado-independencia]
    veja: [coeficiente-binomial]
    reporte: 'OR = 6,4; p = 0,028 (Fisher exato, bilateral)'
    codigo:
      r: |
        fisher.test(tabela)
      py: |
        stats.fisher_exact(tabela)
  - id: ponto-bisserial
    sym: 'rₚᵦ'
    nome: 'Correlação ponto-bisserial'
    fam: assoc
    strip: 2
    pos: 6
    dist: 't(n−2)'
    quando: 'Medir a relação entre uma variável binária e uma quantitativa; equivale ao teste t para dois grupos.'
    h0: 'Não há correlação.'
    pres:
      - 'Variável quantitativa normal em cada grupo'
    tex: 'r_{pb} = \dfrac{\bar{x}_1 - \bar{x}_0}{s_n} \sqrt{\dfrac{n_1 n_0}{n^2}}, \qquad s_n = \sqrt{\tfrac{1}{n} \textstyle\sum (x_i - \bar{x})^2}'
    efeito:
      texto: 'O próprio r_pb.'
    vars:
      - ['Teste equivalente', t-independente]
    reporte: 'r_pb(38) = 0,33; p = 0,038'
    codigo:
      r: |
        cor.test(y, as.numeric(grupo == "B"))
      py: |
        stats.pointbiserialr(binaria, y)
  - id: kappa
    sym: 'κ'
    nome: 'Kappa de Cohen'
    fam: assoc
    strip: 2
    pos: 7
    dist: 'N(0, 1) aprox.'
    quando: 'Medir a concordância entre dois avaliadores que classificam os mesmos itens em categorias, descontando a concordância esperada por acaso.'
    h0: 'A concordância é só a do acaso: κ = 0.'
    pres:
      - 'Os mesmos itens classificados pelos dois avaliadores'
      - 'Categorias fixas e mutuamente exclusivas'
      - 'Avaliações independentes entre si'
    tex: '\kappa = \dfrac{p_o - p_e}{1 - p_e}'
    efeito:
      texto: 'O próprio κ. Pela referência de Landis e Koch, acima de 0,6 é concordância substancial e acima de 0,8, quase perfeita.'
    vars:
      - ['Kappa ponderado, para categorias ordinais', null]
      - ['Kappa de Fleiss, para mais de dois avaliadores', null]

  # ------------------------------------------------------------------ modelos e regressão
    reporte: 'κ = 0,68; IC 95% [0,52; 0,84]: concordância substancial'
    codigo:
      r: |
        library(irr)
        kappa2(dados[, c("aval1", "aval2")])
      py: |
        from sklearn.metrics import cohen_kappa_score
        cohen_kappa_score(aval1, aval2)
  - id: t-coeficiente
    sym: 'β'
    nome: 't de um coeficiente'
    fam: modelos
    strip: 3
    pos: 1
    dist: 't(n−k−1)'
    quando: 'Testar se uma variável explicativa tem efeito numa regressão, mantendo as outras fixas.'
    h0: 'O coeficiente é zero: βⱼ = 0.'
    pres:
      - 'Resíduos independentes, normais e com variância constante'
    tex: 't = \dfrac{\hat{\beta}_j}{EP(\hat{\beta}_j)}'
    efeito:
      texto: 'Coeficiente padronizado: o efeito em desvios padrão de y por desvio padrão de x.'
      tex: '\beta^*_j = \hat{\beta}_j \, \dfrac{s_{x_j}}{s_y}'
    vars:
      - ['Wald, a versão para modelos generalizados', wald]
    page: regressao-linear
    reporte: 'b = 1,85; EP = 0,62; t(47) = 2,98; p = 0,005'
    codigo:
      r: |
        summary(lm(y ~ x1 + x2, data = dados))
      py: |
        import statsmodels.formula.api as smf
        smf.ols("y ~ x1 + x2", data=dados).fit().summary()
  - id: f-global
    sym: 'Fg'
    nome: 'F global da regressão'
    fam: modelos
    strip: 3
    pos: 2
    dist: 'F(k, n−k−1)'
    quando: 'Testar se o modelo de regressão como um todo explica algo, ou se todos os coeficientes podem ser zero.'
    h0: 'Todos os coeficientes (menos o intercepto) são zero.'
    pres:
      - 'Os mesmos da regressão linear'
    tex: 'F = \dfrac{R^2 / k}{(1 - R^2) / (n - k - 1)}'
    efeito:
      texto: 'f² de Cohen. Referências: 0,02, 0,15 e 0,35.'
      tex: 'f^2 = \dfrac{R^2}{1 - R^2}'
    vars:
      - ['F parcial, para comparar modelos aninhados', null]
    veja: [regressao-linear]
    reporte: 'F(2, 47) = 9,4; p < 0,001; R² = 0,29'
    codigo:
      r: |
        summary(lm(y ~ x1 + x2, data = dados))  # o F vem na última linha
      py: |
        import statsmodels.formula.api as smf
        m = smf.ols("y ~ x1 + x2", data=dados).fit()
        m.fvalue, m.f_pvalue
  - id: anova-dois-fatores
    sym: 'F₂'
    nome: 'ANOVA de dois fatores'
    fam: modelos
    strip: 3
    pos: 3
    dist: 'F'
    quando: 'Avaliar ao mesmo tempo o efeito de dois fatores sobre uma resposta numérica, e se eles interagem, como dose e sexo num ensaio.'
    h0: 'Para cada fator, as médias dos níveis são iguais; para a interação, o efeito de um fator não depende do nível do outro.'
    pres:
      - 'Observações independentes'
      - 'Normalidade dos resíduos'
      - 'Variâncias iguais entre as células'
    tex: 'F_A = \dfrac{QM_A}{QM_{\text{erro}}}, \quad F_B = \dfrac{QM_B}{QM_{\text{erro}}}, \quad F_{AB} = \dfrac{QM_{AB}}{QM_{\text{erro}}}'
    efeito:
      texto: 'η² parcial de cada efeito: fator A, fator B e interação.'
      tex: '\eta^2_p = \dfrac{SQ_A}{SQ_A + SQ_{\text{erro}}}'
    vars:
      - ['ANOVA de um fator, com um fator só', anova]
      - ['ANCOVA, quando há também uma covariável numérica', null]
    reporte: 'Dose: F(2, 54) = 7,9; p = 0,001; η²p = 0,23. Interação: F(2, 54) = 1,1; p = 0,34'
    codigo:
      r: |
        summary(aov(y ~ dose * sexo, data = dados))
      py: |
        import statsmodels.api as sm
        import statsmodels.formula.api as smf
        m = smf.ols("y ~ C(dose) * C(sexo)", data=dados).fit()
        sm.stats.anova_lm(m, typ=2)
  - id: razao-verossimilhanca
    sym: 'LR'
    nome: 'Razão de verossimilhança'
    fam: modelos
    strip: 3
    pos: 4
    dist: 'χ²(gl)'
    quando: 'Comparar dois modelos aninhados ajustados por máxima verossimilhança, como numa regressão logística.'
    h0: 'O modelo menor é suficiente.'
    pres:
      - 'Modelos aninhados'
      - 'Amostra grande'
    tex: 'G^2 = 2\left(\ell_{\text{completo}} - \ell_{\text{reduzido}}\right)'
    efeito:
      texto: 'Pseudo-R² de McFadden, comparando com o modelo só com intercepto.'
      tex: 'R^2_{\text{McF}} = 1 - \dfrac{\ell_{\text{completo}}}{\ell_{\text{nulo}}}'
    vars:
      - ['Wald e escore, aproximações do mesmo teste', wald]
    reporte: 'G²(2) = 9,8; p = 0,007'
    codigo:
      r: |
        anova(reduzido, completo, test = "LRT")
      py: |
        G2 = 2 * (completo.llf - reduzido.llf)
        p = stats.chi2.sf(G2, completo.df_model - reduzido.df_model)
  - id: wald
    sym: 'Wd'
    nome: 'Wald'
    fam: modelos
    strip: 3
    pos: 5
    dist: 'χ²(1) ou N(0, 1)'
    quando: 'Testar um coeficiente de um modelo ajustado por máxima verossimilhança usando só o modelo completo.'
    h0: 'O coeficiente é zero.'
    pres:
      - 'Amostra grande'
      - 'Pode falhar com separação perfeita na logística'
    tex: 'W = \left(\dfrac{\hat{\beta}}{EP(\hat{\beta})}\right)^2'
    efeito:
      texto: 'Na regressão logística, a razão de chances do coeficiente.'
      tex: 'OR = e^{\hat{\beta}}'
    vars:
      - ['Razão de verossimilhança, mais confiável', razao-verossimilhanca]
    reporte: 'b = 0,74; EP = 0,29; z = 2,55; p = 0,011; OR = 2,10'
    codigo:
      r: |
        summary(glm(y ~ x, family = binomial, data = dados))
      py: |
        import statsmodels.formula.api as smf
        smf.logit("y ~ x", data=dados).fit().summary()
  - id: hosmer-lemeshow
    sym: 'HL'
    nome: 'Hosmer-Lemeshow'
    fam: modelos
    strip: 3
    pos: 6
    dist: 'χ²(g−2)'
    quando: 'Verificar se as probabilidades previstas por uma regressão logística batem com as frequências observadas, agrupando os casos por faixa de risco.'
    h0: 'O modelo se ajusta bem: as frequências observadas e previstas coincidem.'
    pres:
      - 'Amostra grande'
      - 'O resultado depende do número de grupos g, em geral 10'
    tex: 'HL = \sum_{j=1}^{g} \dfrac{(O_j - E_j)^2}{E_j\,(1 - E_j / n_j)}'
    vars:
      - ['Razão de verossimilhança, para comparar modelos aninhados', razao-verossimilhanca]
    reporte: 'χ²(8) = 6,3; p = 0,61: sem evidência de mau ajuste'
    codigo:
      r: |
        library(ResourceSelection)
        hoslem.test(modelo$y, fitted(modelo), g = 10)
      py: |
        # sem função no statsmodels: agrupe por decis de p_hat
        g = pd.qcut(p_hat, 10, labels=False)
        t = pd.DataFrame({"y": y, "p": p_hat, "g": g}).groupby("g").agg(o=("y", "sum"), e=("p", "sum"), n=("y", "size"))
        HL = ((t.o - t.e)**2 / (t.e * (1 - t.e / t.n))).sum()
        p = stats.chi2.sf(HL, 10 - 2)
  - id: durbin-watson
    sym: 'DW'
    nome: 'Durbin-Watson'
    fam: modelos
    strip: 3
    pos: 7
    dist: 'd (tabelada)'
    quando: 'Verificar autocorrelação de primeira ordem nos resíduos de uma regressão, comum em dados ao longo do tempo.'
    h0: 'Os resíduos não têm autocorrelação.'
    pres:
      - 'Regressão com intercepto'
      - 'Sem a variável resposta defasada entre as explicativas'
    tex: 'd = \dfrac{\sum_{t=2}^{n} (e_t - e_{t-1})^2}{\sum_{t=1}^{n} e_t^2}'
    vars:
      - ['Breusch-Godfrey, para defasagens maiores', null]
      - ['Ljung-Box, nos resíduos de séries', ljung-box]
    reporte: 'd = 1,32; p = 0,004'
    codigo:
      r: |
        library(lmtest)
        dwtest(modelo)
      py: |
        from statsmodels.stats.stattools import durbin_watson
        durbin_watson(modelo.resid)  # só a estatística, sem o p
  - id: breusch-pagan
    sym: 'BP'
    nome: 'Breusch-Pagan'
    fam: modelos
    strip: 3
    pos: 8
    dist: 'χ²(k)'
    quando: 'Verificar se a variância dos resíduos de uma regressão é constante (homocedasticidade).'
    h0: 'Os resíduos são homocedásticos.'
    pres:
      - 'Resíduos aproximadamente normais'
    tex: 'LM = n\, R^2_{\text{aux}}'
    vars:
      - ['White, sem supor uma forma para a heterocedasticidade', null]

  # ------------------------------------------------------------------ séries temporais
    reporte: 'BP(2) = 8,9; p = 0,012'
    codigo:
      r: |
        library(lmtest)
        bptest(modelo)
      py: |
        from statsmodels.stats.diagnostic import het_breuschpagan
        het_breuschpagan(modelo.resid, modelo.model.exog)
  - id: dickey-fuller
    sym: 'ADF'
    nome: 'Dickey-Fuller aumentado'
    fam: series
    strip: 4
    pos: 1
    dist: 'τ (Dickey-Fuller)'
    quando: 'Verificar se uma série temporal tem raiz unitária, isto é, se não é estacionária.'
    h0: 'A série tem raiz unitária (não é estacionária).'
    pres:
      - 'Escolher bem o número de defasagens'
      - 'Indicar se há constante e tendência'
    tex: '\Delta y_t = \alpha + \gamma\, y_{t-1} + \sum_i \delta_i\, \Delta y_{t-i} + \varepsilon_t, \qquad \tau = \dfrac{\hat{\gamma}}{EP(\hat{\gamma})}'
    vars:
      - ['KPSS, com a hipótese nula invertida', kpss]
    reporte: 'ADF = −3,62; 4 defasagens; p = 0,034: rejeita a raiz unitária'
    codigo:
      r: |
        library(tseries)
        adf.test(serie)
      py: |
        from statsmodels.tsa.stattools import adfuller
        adfuller(serie)
  - id: kpss
    sym: 'KP'
    nome: 'KPSS'
    fam: series
    strip: 4
    pos: 2
    dist: 'η (tabelada)'
    quando: 'Verificar a estacionariedade de uma série com a hipótese nula invertida em relação ao ADF; os dois juntos se complementam.'
    h0: 'A série é estacionária.'
    pres:
      - 'Escolher a janela da variância de longo prazo'
    tex: '\eta = \dfrac{1}{n^2} \dfrac{\sum_t S_t^2}{\hat{\sigma}^2}'
    vars:
      - ['Dickey-Fuller aumentado', dickey-fuller]
    reporte: 'KPSS = 0,21; p > 0,10: não rejeita a estacionariedade'
    codigo:
      r: |
        library(tseries)
        kpss.test(serie)
      py: |
        from statsmodels.tsa.stattools import kpss
        kpss(serie)
  - id: ljung-box
    sym: 'LB'
    nome: 'Ljung-Box'
    fam: series
    strip: 4
    pos: 3
    dist: 'χ²(h)'
    quando: 'Verificar se uma série, ou os resíduos de um modelo, ainda têm autocorrelação em várias defasagens.'
    h0: 'As autocorrelações até a defasagem h são todas zero (ruído branco).'
    pres:
      - 'Nos resíduos de um ARMA, descontar do gl os parâmetros estimados'
    tex: 'Q = n(n + 2) \sum_{k=1}^{h} \dfrac{\hat{\rho}_k^2}{n - k}'
    vars:
      - ['Box-Pierce, a versão original e menos precisa', null]
    reporte: 'Q(10) = 12,4; p = 0,26'
    codigo:
      r: |
        Box.test(residuos, lag = 10, type = "Ljung-Box")
      py: |
        from statsmodels.stats.diagnostic import acorr_ljungbox
        acorr_ljungbox(residuos, lags=[10])
