# English text for the decision tree (/en/statistical-tests/decision-tree/).
#
# The tree itself lives in _data/arvore_testes.yml; this file only maps each
# Portuguese question, answer and note to its English version. The build
# fails if a text from the tree is missing here (_plugins/paginas_testes.rb).

'O que você quer fazer?': 'What do you want to do?'
'Comparar grupos, ou um grupo com um valor de referência': 'Compare groups, or one group with a reference value'
'Que tipo de resposta você mediu?': 'What kind of response did you measure?'
'Numérica: uma medida, como peso, tempo ou nota': 'Numeric: a measurement, such as weight, time or score'
'Quantos grupos ou medidas?': 'How many groups or measurements?'
'Um grupo, contra um valor de referência': 'One group, against a reference value'
'Os dados são aproximadamente normais, ou a amostra é grande (n ≳ 30)?': 'Are the data approximately normal, or is the sample large (n ≳ 30)?'
'Sim': 'Yes'
'Não': 'No'
'Dois grupos': 'Two groups'
'Os grupos são de indivíduos diferentes ou dos mesmos indivíduos?': 'Are the groups made of different individuals or the same individuals?'
'Indivíduos diferentes (independentes)': 'Different individuals (independent)'
'Os dados são aproximadamente normais em cada grupo, ou as amostras são grandes?': 'Are the data approximately normal in each group, or are the samples large?'
'Use a versão de Welch, que não exige variâncias iguais.': 'Use Welch’s version, which does not require equal variances.'
'Não, ou a resposta é ordinal': 'No, or the response is ordinal'
'Os mesmos indivíduos, como antes e depois (pareados)': 'The same individuals, such as before and after (paired)'
'As diferenças entre os pares são aproximadamente normais?': 'Are the differences between pairs approximately normal?'
'Não, mas são simétricas': 'No, but they are symmetric'
'Não, e nem simétricas': 'No, and not symmetric either'
'Três ou mais grupos': 'Three or more groups'
'Os resíduos são aproximadamente normais?': 'Are the residuals approximately normal?'
'Os mesmos indivíduos, em várias condições ou momentos': 'The same individuals, under several conditions or time points'
'Dois fatores ao mesmo tempo, como dose e sexo': 'Two factors at once, such as dose and sex'
'Categórica: sim ou não, ou categorias': 'Categorical: yes or no, or categories'
'Um grupo, contra uma proporção de referência': 'One group, against a reference proportion'
'Um grupo, com várias categorias contra frequências esperadas': 'One group, with several categories against expected frequencies'
'Dois grupos independentes': 'Two independent groups'
'Todas as contagens esperadas são de pelo menos 5?': 'Are all expected counts at least 5?'
'Duas medidas nos mesmos indivíduos': 'Two measurements on the same individuals'
'Três ou mais grupos independentes': 'Three or more independent groups'
'Três ou mais medidas nos mesmos indivíduos': 'Three or more measurements on the same individuals'
'A dispersão, e não o centro': 'The spread, not the center'
'Um grupo, contra uma variância de referência': 'One group, against a reference variance'
'Os dados são normais?': 'Are the data normal?'
'Não, ou não dá para garantir': 'No, or it cannot be assured'
'Medir a relação entre duas variáveis': 'Measure the relationship between two variables'
'Que tipo são as variáveis?': 'What kind of variables are they?'
'As duas numéricas': 'Both numeric'
'A relação é linear, sem valores extremos fortes?': 'Is the relationship linear, without strong extreme values?'
'Não, ou as variáveis são ordinais': 'No, or the variables are ordinal'
'A amostra é pequena ou tem muitos empates?': 'Is the sample small, or does it have many ties?'
'As duas categóricas': 'Both categorical'
'Não, numa tabela 2 × 2': 'No, in a 2 × 2 table'
'Uma binária e uma numérica': 'One binary and one numeric'
'Dois avaliadores classificando os mesmos itens': 'Two raters classifying the same items'
'Verificar um pressuposto ou a distribuição dos dados': 'Check an assumption or the distribution of the data'
'O que você quer verificar?': 'What do you want to check?'
'Se os dados são normais': 'Whether the data are normal'
'De que tamanho é a amostra?': 'How large is the sample?'
'Pequena ou média': 'Small or medium'
'Grande, como em econometria': 'Large, as in econometrics'
'Com n muito grande, qualquer teste rejeita desvios irrelevantes: olhe também o gráfico Q-Q.': 'With very large n, any test rejects irrelevant departures: look at the Q-Q plot too.'
'Se os dados seguem outra distribuição contínua': 'Whether the data follow another continuous distribution'
'Os parâmetros da distribuição são conhecidos de antemão?': 'Are the parameters of the distribution known in advance?'
'Não, são estimados dos dados': 'No, they are estimated from the data'
'Se as frequências de categorias são as esperadas': 'Whether the category frequencies are the expected ones'
'Se um valor extremo é um outlier': 'Whether an extreme value is an outlier'
'Se os grupos têm a mesma variância': 'Whether the groups have the same variance'
'A esfericidade, antes de uma ANOVA de medidas repetidas': 'Sphericity, before a repeated measures ANOVA'
'Testar um modelo de regressão': 'Test a regression model'
'O que você quer testar?': 'What do you want to test?'
'Se uma variável explicativa tem efeito': 'Whether an explanatory variable has an effect'
'Como o modelo foi ajustado?': 'How was the model fitted?'
'Mínimos quadrados (regressão linear)': 'Least squares (linear regression)'
'Máxima verossimilhança, como a logística': 'Maximum likelihood, such as logistic regression'
'Se o modelo como um todo explica algo': 'Whether the model as a whole explains anything'
'Se um modelo maior vale a pena frente a um menor': 'Whether a larger model is worth it over a smaller one'
'O ajuste de uma regressão logística': 'The fit of a logistic regression'
'Os resíduos': 'The residuals'
'Qual problema você suspeita?': 'What problem do you suspect?'
'Autocorrelação, em dados ao longo do tempo': 'Autocorrelation, in data over time'
'Variância que muda com os valores previstos': 'Variance that changes with the fitted values'
'Analisar uma série temporal': 'Analyze a time series'
'O que você quer saber?': 'What do you want to know?'
'Se a série é estacionária': 'Whether the series is stationary'
'Os dois têm hipóteses nulas opostas: rodar ambos dá uma conclusão mais firme.': 'The two have opposite null hypotheses: running both gives a firmer conclusion.'
'Se ainda há autocorrelação, ou se é ruído branco': 'Whether there is still autocorrelation, or it is white noise'
