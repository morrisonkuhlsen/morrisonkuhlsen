<!doctype html>
<html lang="{{ page.lang | default: site.lang }}">
<head>
  {%- include head.html -%}
</head>
<body>
  {%- include icons.html -%}
  {%- include annbar.html -%}
  {%- include header.html -%}

  <main class="site-main{% if page.hero_image %} site-main--hero{% endif %}" id="content">
    {{ content }}
  </main>

  {%- include footer.html -%}
  {%- include search.html -%}
  {%- include cookiebar.html -%}
  <script src="{{ '/assets/js/site.js' | relative_url }}"
          data-search-index="{{ '/search.json' | relative_url }}" defer></script>
  {%- if page.layout == 'post' or page.layout == 'page' %}
  <script src="{{ '/assets/js/code-copy.js' | relative_url }}" defer></script>
  {%- endif %}
</body>
</html>
