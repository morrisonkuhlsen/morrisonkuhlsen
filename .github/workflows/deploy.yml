name: Build and Deploy Jekyll site to Pages

on:
  push:
    branches: ["master"]
  schedule:
    - cron: '0 9 * * 3'  # Toda quarta-feira às 09:00 UTC (06:00 BRT) — publica posts agendados
    - cron: '0 12 13 5 *' # 13/05/2026 às 12:00 UTC (09:00 BRT) — post questoes-livros-famosos-vol1
    - cron: '0 12 20 5 *' # 20/05/2026 às 12:00 UTC (09:00 BRT) — post operador-eml-funcoes-elementares
  workflow_dispatch: # Permite rodar manualmente pelo GitHub

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
