{%- assign lang = page.lang | default: site.lang -%}
{%- assign ui = site.data.site.ui -%}

<div class="search" id="search" role="dialog" aria-modal="true"
     aria-label="{{ ui.search[lang] }}" hidden>
  <div class="search__panel">

    <div class="search__field">
      <svg class="search__icon" aria-hidden="true"><use href="#i-search"></use></svg>
      <input class="search__input" id="search-input" type="search"
             placeholder="{% if lang == 'en' %}Search the site…{% else %}Buscar no site…{% endif %}"
             autocomplete="off" spellcheck="false" aria-label="{{ ui.search[lang] }}"
             aria-controls="search-results" aria-expanded="false">
      <button class="search__close" type="button" id="search-close"
              aria-label="{{ ui.close[lang] }}">ESC</button>
    </div>

    <div class="search__results" id="search-results" role="listbox"
         aria-label="{% if lang == 'en' %}Results{% else %}Resultados{% endif %}"></div>

    <div class="search__footer">
      <span><kbd>↑</kbd><kbd>↓</kbd> {% if lang == 'en' %}Navigate{% else %}Navegar{% endif %}</span>
      <span><kbd>↵</kbd> {% if lang == 'en' %}Open{% else %}Abrir{% endif %}</span>
      <span><kbd>ESC</kbd> {% if lang == 'en' %}Close{% else %}Fechar{% endif %}</span>
    </div>

  </div>
</div>
